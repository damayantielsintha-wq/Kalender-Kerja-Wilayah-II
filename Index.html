<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kalender Kerja Wilayah II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5fb; --bg2:#eceefa; --card:rgba(255,255,255,.72); --card-solid:#fff; --line:rgba(20,20,60,.08);
  --text:#16172b; --muted:#6b6f8a; --accent:#6d5dfc; --accent2:#22c3e6; --accent-soft:rgba(109,93,252,.12);
  --danger:#f0476b; --ok:#16b981; --warn:#f5a524; --shadow:0 10px 40px -12px rgba(40,30,120,.25);
  --r:18px; --blur:saturate(180%) blur(18px);
}
:root[data-theme=dark]{
  --bg:#0c0d17; --bg2:#12131f; --card:rgba(26,27,44,.72); --card-solid:#181a2b; --line:rgba(255,255,255,.08);
  --text:#eceefe; --muted:#9296b8; --accent-soft:rgba(109,93,252,.22); --shadow:0 10px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,rgba(109,93,252,.28),transparent 70%),
             radial-gradient(35% 30% at 90% 15%,rgba(34,195,230,.22),transparent 70%),
             radial-gradient(40% 40% at 70% 95%,rgba(240,71,107,.14),transparent 70%);
  animation:aurora 22s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate3d(3%,-2%,0) rotate(6deg) scale(1.05)}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.glass{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow)}
.app{display:grid;grid-template-columns:290px 1fr;height:100dvh;gap:16px;padding:16px}
/* sidebar */
.side{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px -6px var(--accent)}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b7dff);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-soft{background:var(--bg2);border:1px solid var(--line)}
.btn-danger{background:rgba(240,71,107,.12);color:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini span{padding:6px 0;border-radius:8px;cursor:pointer;position:relative}
.mini .h{color:var(--muted);font-weight:700;cursor:default}
.mini .o{opacity:.35}.mini .t{background:var(--accent);color:#fff;font-weight:700}
.mini span.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent2)}
.mini span:not(.h):hover{background:var(--accent-soft)}
.cats label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer}
.cats label:hover{background:var(--accent-soft)}
.cats input{display:none}
.cats .sw{width:14px;height:14px;border-radius:5px;border:2px solid;transition:.2s}
.cats input:checked+.sw{background:currentColor}
.cats .n{margin-left:auto;color:var(--muted);font-size:12px}
.up{display:flex;flex-direction:column;gap:8px}
.up .it{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.up .it:hover{background:var(--accent-soft)}
.up .d{width:40px;text-align:center;border-radius:10px;padding:4px 0;background:var(--bg2);font-size:11px;color:var(--muted)}
.up .d b{display:block;font-size:16px;color:var(--text)}
.up .it div:last-child{min-width:0}.up .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* main */
.main{display:flex;flex-direction:column;min-width:0;gap:14px}
.top{border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0 8px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.top h1 span{color:var(--muted);font-weight:500}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card-solid);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:38px;min-width:200px}
.search input{border:0;background:none;outline:none;width:100%}
kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--card-solid)}
.quick{border-radius:18px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px}
.quick input{flex:1;border:0;background:none;outline:none;padding:10px 0}
.quick .hint{font-size:12px;color:var(--muted)}
.view{flex:1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.avatar.sm{width:22px;height:22px;font-size:10px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
/* month */
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 12px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dow div{padding-left:10px}
.month{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;padding:0 12px 12px;min-height:0}
.cell{border-radius:14px;padding:6px;background:var(--card-solid);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden;cursor:pointer;transition:.15s;position:relative}
.cell:hover{border-color:var(--accent);box-shadow:0 6px 18px -10px var(--accent)}
.cell.out{opacity:.45}.cell.we .num{color:var(--danger)}
.cell.drop{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.cell .num{font-weight:700;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:9px}
.cell.today .num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.cell .heat{position:absolute;top:10px;right:10px;display:flex;gap:2px}
.cell .heat i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5}
.chip{font-size:12px;padding:3px 7px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid;cursor:grab;flex:none}
.chip.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);padding-left:6px;font-weight:600}
/* week */
.week{flex:1;display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:8px;padding:12px;overflow:auto}
.wcol{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.wcol.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcol h4{margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.wcol h4 b{font-size:22px}
.card{border-radius:12px;padding:10px;border-left:4px solid;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px)}
.card b{display:block;margin-bottom:2px}.card small{color:var(--muted);display:block}
/* agenda & board */
.scroll{flex:1;overflow:auto;padding:16px}
.agday{display:grid;grid-template-columns:90px 1fr;gap:14px;margin-bottom:16px}
.agday .dt{position:sticky;top:0;align-self:start;text-align:center;padding:10px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line)}
.agday .dt b{display:block;font-size:26px}.agday .dt small{color:var(--muted)}
.agday .list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line);cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .bar{width:4px;align-self:stretch;border-radius:4px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;margin-top:3px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;padding:12px;overflow:auto}
.lane{background:var(--bg2);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.lane.drop{outline:2px dashed var(--accent)}
.lane h4{margin:4px 6px 6px;display:flex;justify-content:space-between}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpi{padding:16px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line)}
.kpi b{font-size:30px;display:block;letter-spacing:-.02em}.kpi small{color:var(--muted)}
.panel{padding:16px;border-radius:18px;background:var(--card-solid);border:1px solid var(--line);margin-top:12px}
.panel h3{margin:0 0 12px;font-size:15px}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar span:first-child{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:10px;border-radius:10px;background:var(--bg2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:10px}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;overflow:auto;padding-bottom:4px}
.heatmap i{width:12px;height:12px;border-radius:3px;background:var(--bg2)}
.log{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log .what{font-size:13px}.log small{color:var(--muted)}
.log pre{white-space:pre-wrap;font-size:11px;background:var(--bg2);padding:8px;border-radius:10px;margin:6px 0 0;max-height:140px;overflow:auto}
.todo-g h3{font-size:13px;margin:18px 0 8px;display:flex;gap:8px;align-items:center}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line);margin-bottom:6px}
.todo input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .tt{flex:1;min-width:0}.todo small{color:var(--muted);display:block;cursor:pointer}
.ai-doc{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.ai-doc pre{white-space:pre-wrap;font-family:inherit;font-size:12px;background:var(--card-solid);padding:10px;border-radius:10px;max-height:180px;overflow:auto}
.ai-hero{border-radius:18px;padding:16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#6d5dfc,#e654c8,#22c3e6);background-size:200% 200%;animation:grad 6s ease infinite}
@keyframes grad{50%{background-position:100% 50%}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(760px,100%);max-height:92dvh;display:flex;flex-direction:column;border-radius:26px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}}
.mh{padding:18px 20px 0;display:flex;align-items:center;gap:10px}
.mh h2{margin:0;font-size:18px;flex:1}
.tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;transition:.2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.f textarea{min-height:90px;resize:vertical}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-weight:600;font-size:12px}
.pills button.on{color:#fff;border-color:transparent}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{display:none}
.switch i{width:40px;height:22px;border-radius:20px;background:var(--line);position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i::after{left:20px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.chk input[type=text]{flex:1}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.warn{padding:10px 12px;border-radius:12px;background:rgba(245,165,36,.14);color:#b77400;font-size:13px;margin-bottom:12px;display:none}
.drop-zone{border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted);transition:.2s;cursor:pointer}
.drop-zone.hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.file{border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--bg2);cursor:pointer;position:relative;transition:.2s}
.file:hover{transform:translateY(-2px);border-color:var(--accent)}
.file .th{height:92px;display:grid;place-items:center;font-size:30px;background-size:cover;background-position:center}
.file .nm{padding:8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .nm small{display:block;color:var(--muted);font-weight:500}
.file .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center}
.file:hover .x{display:grid}
.prog{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.hover-card{position:fixed;z-index:80;width:300px;border-radius:16px;overflow:hidden;pointer-events:none;display:none;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.hover-card img{width:100%;display:block;max-height:260px;object-fit:cover;background:var(--bg2)}
.hover-card div{padding:10px 12px;font-size:12px}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(5,5,15,.88);display:none;flex-direction:column}
.viewer.show{display:flex}
.viewer header{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff}
.viewer header b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe,.viewer img{flex:1;border:0;width:100%;background:#111;object-fit:contain}
.viewer header a,.viewer header button{color:#fff}
.cmt{display:flex;gap:10px;margin-bottom:14px}
.cmt .bub{background:var(--bg2);padding:10px 12px;border-radius:4px 14px 14px 14px;flex:1}
.cmt small{color:var(--muted)}
.detail-hero{border-radius:18px;padding:16px;color:#fff;margin-bottom:14px}
.detail-hero h3{margin:6px 0;font-size:20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
/* palette & toast */
.palette{position:fixed;inset:0;z-index:95;background:rgba(10,10,30,.4);backdrop-filter:blur(3px);display:none;justify-content:center;padding-top:12vh}
.palette.show{display:flex}
.palette .box{width:min(620px,92vw);border-radius:20px;background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;align-self:flex-start}
.palette input{width:100%;padding:18px 20px;border:0;outline:none;background:none;font-size:16px;border-bottom:1px solid var(--line)}
.palette .res{max-height:50vh;overflow:auto;padding:6px}
.palette .opt{padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.palette .opt.on,.palette .opt:hover{background:var(--accent-soft)}
.palette .opt small{margin-left:auto;color:var(--muted)}
.toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:14px;background:#1d1e33;color:#fff;box-shadow:var(--shadow);animation:pop .3s;display:flex;gap:10px;align-items:center;max-width:360px}
.toast button{color:#9d93ff;font-weight:700}
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:var(--bg)}
.loader div{width:46px;height:46px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.fab,.bnav{display:none}
.now-badge{font-size:10px;font-weight:800;color:#fff;background:var(--danger);padding:2px 6px;border-radius:6px;animation:pulse 2s infinite}
/* mobile */
@media (max-width:900px){
  body{font-size:15px}
  .app{grid-template-columns:1fr;padding:10px 10px 84px;gap:10px}
  .side{display:none;position:fixed;inset:0 0 70px 0;z-index:40;border-radius:0 0 24px 24px}
  .side.open{display:flex;animation:fade .2s}
  .top{padding:8px}.top h1{font-size:18px;margin:0 4px;order:-1;flex:1}
  .top .hide-m{display:none}
  .search{min-width:0;flex:1;order:5;width:100%}
  .quick .hint{display:none}
  .dow{padding:8px 6px 4px}.dow div{padding:0;text-align:center}
  .month{gap:3px;padding:0 6px 6px}
  .cell{padding:3px;border-radius:10px;align-items:center}
  .cell .num{font-size:12px;width:24px;height:24px}
  .cell .chip{display:none}.cell .more{display:none}.cell .heat{position:static}
  .cell .heat i{width:6px;height:6px}
  .week{grid-template-columns:1fr;}
  .wcol{min-height:auto}
  .board{grid-template-columns:repeat(4,85vw);scroll-snap-type:x mandatory}.lane{scroll-snap-align:start}
  .agday{grid-template-columns:60px 1fr;gap:10px}
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:26px 26px 0 0;max-height:94dvh;animation:sheet .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
  .fab{display:grid;position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:20px;z-index:30;place-items:center;color:#fff;font-size:28px;

<script>
/* ============================================================ backend bridge
 * Di Apps Script memakai google.script.run; jika dibuka sebagai file lokal
 * (tanpa Apps Script) otomatis memakai mode DEMO berbasis localStorage. */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn, ...args) {
  if (IS_GAS) return new Promise((res, rej) =>
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e.message || e)))[fn](...args));
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e); } }, 120));
}

const Demo = (() => {
  const K = 'kkw2-demo-v2';
  const db = JSON.parse(localStorage.getItem(K) || 'null') || seed();
  const me = 'demo@gmail.com';
  function save() { db.version++; localStorage.setItem(K, JSON.stringify(db)); }
  function id() { return Math.random().toString(36).slice(2, 14); }
  function log(aksi, ev, detail) { db.logs.push({ waktu: new Date().toISOString(), pengguna: me, aksi, eventId: ev.id, judul: ev.judul || '', detail: detail || '' }); }
  function seed() {
    const d = (o) => { const x = new Date(); x.setDate(x.getDate() + o); return x.toISOString().slice(0, 10); };
    const mk = (judul, o, len, jm, js, kat, pr, st, lok, by) => ({ id: Math.random().toString(36).slice(2, 14), judul, deskripsi: 'Contoh kegiatan demo.', mulai: d(o), selesai: d(o + len),
      jamMulai: jm, jamSelesai: js, seharian: !jm, lokasi: lok, kategori: kat, prioritas: pr, status: st, peserta: [], checklist: [{ t: 'Siapkan materi', d: true }, { t: 'Undangan', d: false }], tautan: [],
      dibuatOleh: by, dibuatPada: new Date().toISOString(), diubahOleh: by, diubahPada: new Date().toISOString() });
    return { version: 1, files: [], comments: [], logs: [], events: [
      mk('Rapat Koordinasi Wilayah', 0, 0, '09:00', '11:00', 'Rapat', 'Tinggi', 'Berjalan', 'Aula Kantor', 'andi@gmail.com'),
      mk('Penyumpahan Wali dan Inventarisasi Harta', 2, 0, '14:00', '16:00', 'Penyumpahan', 'Tinggi', 'Direncanakan', 'Ruang Rapat BHP Medan', 'sari@gmail.com'),
      mk('Laporan Bulanan', 5, 0, '13:00', '15:00', 'Laporan', 'Tinggi', 'Direncanakan', 'Online', 'demo@gmail.com'),
      mk('Pelatihan SDM', -3, 0, '08:00', '16:00', 'Pelatihan', 'Rendah', 'Selesai', 'Balai Diklat', 'budi@gmail.com'),
      mk('Koordinasi ke Pemkab Deli Serdang', 9, 0, '08:30', '12:00', 'Koordinasi', 'Sedang', 'Direncanakan', 'Kantor Bupati Deli Serdang', 'andi@gmail.com'),
    ] };
  }
  const alive = () => db.events.filter(e => !e.dihapus);
  return {
    apiBootstrap: () => ({ events: alive(), files: db.files.filter(f => !f.dihapus), comments: db.comments, version: db.version, user: me, rootUrl: '#', sheetUrl: '#', maxUploadMb: 5 }),
    apiData: () => ({ events: alive(), files: db.files.filter(f => !f.dihapus), comments: db.comments, version: db.version }),
    apiVersion: () => db.version,
    apiSaveEvent(inp) {
      if (!inp.judul) throw new Error('Judul kegiatan wajib diisi');
      const t = new Date().toISOString();
      if (inp.id) { const e = db.events.find(x => x.id === inp.id); Object.assign(e, inp, { diubahOleh: me, diubahPada: t }); log('UBAH', e, ''); save(); return e; }
      const e = Object.assign({}, inp, { id: id(), dibuatOleh: me, dibuatPada: t, diubahOleh: me, diubahPada: t });
      if (!e.selesai || e.selesai < e.mulai) e.selesai = e.mulai;
      db.events.push(e); log('BUAT', e, ''); save(); return e;
    },
    apiMoveEvent(i, mulai) { const e = db.events.find(x => x.id === i); const span = dayDiff(e.mulai, e.selesai); e.mulai = mulai; e.selesai = addDays(mulai, span); log('PINDAH', e, mulai); save(); return e; },
    apiDeleteEvent(i) { const e = db.events.find(x => x.id === i); e.dihapus = true; log('HAPUS', e, ''); save(); return true; },
    apiRestoreEvent(i) { const e = db.events.find(x => x.id === i); e.dihapus = false; log('PULIHKAN', e, ''); save(); return true; },
    apiDuplicateEvent(i, mulai) { const e = db.events.find(x => x.id === i); return this.apiSaveEvent(Object.assign({}, e, { id: '', mulai, selesai: addDays(mulai, dayDiff(e.mulai, e.selesai)), status: 'Direncanakan' })); },
    apiToggleChecklist(i, n) { const e = db.events.find(x => x.id === i); e.checklist[n].d = !e.checklist[n].d; log('CHECKLIST', e, e.checklist[n].t); save(); return e; },
    apiUpload(eventId, nama, mime, b64) { const f = { id: id(), eventId, fileId: '', nama, mime, ukuran: Math.round(b64.length * .75), url: 'data:' + mime + ';base64,' + b64, oleh: me, pada: new Date().toISOString() };
      db.files.push(f); log('UNGGAH', { id: eventId }, nama); try { save(); } catch (e) { db.files.pop(); throw new Error('Penyimpanan demo penuh — pakai file kecil'); } return f; },
    apiDeleteFile(i) { const f = db.files.find(x => x.id === i); f.dihapus = true; log('HAPUS_FILE', { id: f.eventId }, f.nama); save(); return true; },
    apiComment(eventId, isi) { const c = { id: id(), eventId, oleh: me, pada: new Date().toISOString(), isi }; db.comments.push(c); log('KOMENTAR', { id: eventId }, isi); save(); return c; },
    apiAiDocs(i) { const e = db.events.find(x => x.id === i); log('AI_DOKUMEN', e, 'template'); save(); return { sumber: 'template', docs: null }; },
    apiCreateDoc(i, nama, isi) { return this.apiUpload(i, nama + '.txt', 'text/plain', btoa(unescape(encodeURIComponent(isi)))); },
    apiAddChecklist(i, items) { const e = db.events.find(x => x.id === i); [].concat(items).forEach(t => { if (!e.checklist.some(c => c.t === t)) e.checklist.push({ t, d: false }); }); log('CHECKLIST', e, '+ ' + items); save(); return e; },
    apiLogs(limit, eventId) { return db.logs.filter(l => !eventId || l.eventId === eventId).slice(-(limit || 300)).reverse(); },
  };
})();

/* ============================================================ constants & state */
const CATS = { Umum: '#6d5dfc', Rapat: '#22a3e6', Koordinasi: '#0ea5a4', Penyumpahan: '#8b5cf6', Inventarisasi: '#d97706', Lapangan: '#16b981', Laporan: '#f5a524', Pelatihan: '#e654c8', Cuti: '#f0476b', Lainnya: '#8a8fa8' };
const PRI = { Rendah: '#16b981', Sedang: '#f5a524', Tinggi: '#f0476b' };
const STAT = ['Direncanakan', 'Berjalan', 'Selesai', 'Dibatalkan'];
const STAT_C = { Direncanakan: '#6d5dfc', Berjalan: '#22a3e6', Selesai: '#16b981', Dibatalkan: '#8a8fa8' };
const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HR = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const HR_FULL = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const S = { events: [], files: [], comments: [], user: '', version: 0, view: 'month', cursor: new Date(), sel: todayKey(),
  hidden: new Set(JSON.parse(localStorage.getItem('kkw2-hidden') || '[]')), maxUploadMb: 25 };
let current = null; // event being viewed/edited

/* ============================================================ date utils */
function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayKey() { return key(new Date()); }
function parse(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = parse(k); d.setDate(d.getDate() + n); return key(d); }
function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
function fmtLong(k) { const d = parse(k); return HR[d.getDay()] + ', ' + d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtShort(k) { const d = parse(k); return d.getDate() + ' ' + BLN[d.getMonth()].slice(0, 3); }
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'baru saja'; if (s < 3600) return Math.floor(s / 60) + ' mnt lalu';
  if (s < 86400) return Math.floor(s / 3600) + ' jam lalu'; if (s < 604800) return Math.floor(s / 86400) + ' hari lalu';
  return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(email, sm) { const n = String(email || '?').split('@')[0]; return `<div class="avatar ${sm ? 'sm' : ''}" title="${esc(email)}" style="background:hsl(${hue(email)} 65% 55%)">${esc(n.slice(0, 2).toUpperCase())}</div>`; }
function color(e) { return CATS[e.kategori] || CATS.Umum; }
function soft(c, a = .14) { const n = parseInt(c.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function size(b) { b = Number(b); return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function timeStr(e) { return e.seharian || !e.jamMulai ? 'Seharian' : e.jamMulai + (e.jamSelesai ? '–' + e.jamSelesai : ''); }
function isNow(e) {
  const t = todayKey(); if (t < e.mulai || t > e.selesai) return false;
  if (e.seharian || !e.jamMulai) return false;
  const n = new Date().toTimeString().slice(0, 5); return n >= e.jamMulai && n <= (e.jamSelesai || '23:59');
}

/* ============================================================ data */
function visible() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const mine = document.getElementById('onlyMine').checked;
  return S.events.filter(e => !S.hidden.has(e.kategori))
    .filter(e => !mine || e.dibuatOleh === S.user || (e.peserta || []).includes(S.user))
    .filter(e => !q || [e.judul, e.deskripsi, e.lokasi, e.kategori, e.dibuatOleh, (e.peserta || []).join(' ')].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (a.mulai + (a.jamMulai || '00')).localeCompare(b.mulai + (b.jamMulai || '00')));
}
function eventsOn(k, list) { return (list || visible()).filter(e => e.mulai <= k && e.selesai >= k); }
function filesOf(id) { return S.files.filter(f => f.eventId === id); }
function commentsOf(id) { return S.comments.filter(c => c.eventId === id); }

function applyData(d) {
  S.events = d.events; S.files = d.files; S.comments = d.comments; S.version = d.version;
  try { localStorage.setItem('kkw2-cache', JSON.stringify(d)); } catch (e) {}
}
async function refresh(silent) {
  const d = await call('apiData');
  const before = S.version; applyData(d); render();
  if (current && current.id) { const upd = S.events.find(e => e.id === current.id); if (upd) current = upd; }
  if (!silent && before && d.version !== before) toast('🔄 Data diperbarui oleh anggota tim');
}

/* ============================================================ render */
function render() {
  document.querySelectorAll('#seg button,#bnav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  renderSide();
  const v = document.getElementById('view');
  const c = S.cursor;
  const title = document.getElementById('title');
  title.innerHTML = `${BLN[c.getMonth()]} <span>${c.getFullYear()}</span>`;
  ({ month: renderMonth, week: renderWeek, agenda: renderAgenda, todo: renderTodo, board: renderBoard, stats: renderStats, log: renderLog }[S.view] || renderMonth)(v);
}

function renderSide() {
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  document.getElementById('miniTitle').textContent = BLN[m] + ' ' + y;
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const has = new Set(); S.events.forEach(e => { for (let k = e.mulai; k <= e.selesai; k = addDays(k, 1)) has.add(k); });
  let h = HR.map(x => `<span class="h">${x[0]}</span>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = key(d);
    h += `<span class="${d.getMonth() !== m ? 'o' : ''} ${k === todayKey() ? 't' : ''} ${has.has(k) ? 'has' : ''}" onclick="pickDay('${k}')">${d.getDate()}</span>`;
  }
  document.getElementById('mini').innerHTML = h;
  document.getElementById('cats').innerHTML = Object.entries(CATS).map(([n, col]) =>
    `<label style="color:${col}"><input type="checkbox" ${S.hidden.has(n) ? '' : 'checked'} onchange="toggleCat('${n}')"><span class="sw"></span>
     <span style="color:var(--text)">${n}</span><span class="n">${S.events.filter(e => e.kategori === n).length}</span></label>`).join('');
  const up = S.events.filter(e => e.selesai >= todayKey() && e.status !== 'Selesai' && e.status !== 'Dibatalkan')
    .sort((a, b) => (a.mulai + a.jamMulai).localeCompare(b.mulai + b.jamMulai)).slice(0, 6);
  document.getElementById('upcoming').innerHTML = up.length ? up.map(e => {
    const d = parse(e.mulai < todayKey() ? todayKey() : e.mulai);
    return `<div class="it" onclick="openDetail('${e.id}')"><div class="d" style="border-left:3px solid ${color(e)}">${HR[d.getDay()]}<b>${d.getDate()}</b></div>
      <div><b>${esc(e.judul)} ${isNow(e) ? '<span class="now-badge">LIVE</span>' : ''}</b><small style="color:var(--muted)">${timeStr(e)}${e.lokasi ? ' · ' + esc(e.lokasi) : ''}</small></div></div>`;
  }).join('') : '<small style="color:var(--muted)">Tidak ada kegiatan mendatang 🎉</small>';
}

function renderMonth(v) {
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
  const list = visible();
  const weeks = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  let h = `<div class="dow">${HR.map(x => `<div>${x}</div>`).join('')}</div><div class="month" style="grid-template-rows:repeat(${weeks},1fr)">`;
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = key(d);
    const ev = eventsOn(k, list);
    const cls = [d.getMonth() !== m && 'out', k === todayKey() && 'today', (d.getDay() === 0) && 'we', k === S.sel && 'sel'].filter(Boolean).join(' ');
    h += `<div class="cell ${cls}" data-k="${k}" onclick="cellClick(event,'${k}')" ondragover="dragOver(event)" ondragleave="this.classList.remove('drop')" ondrop="dropDay(event,'${k}')">
      <div class="num">${d.getDate()}</div>
      ${ev.length ? `<div class="heat">${ev.slice(0, 4).map(e => `<i style="background:${color(e)};opacity:1"></i>`).join('')}</div>` : ''}
      ${ev.slice(0, 3).map(e => chip(e)).join('')}
      ${ev.length > 3 ? `<div class="more">+${ev.length - 3} lainnya</div>` : ''}
    </div>`;
  }
  h += '</div>';
  // Di HP: daftar kegiatan hari terpilih di bawah grid
  const sel = eventsOn(S.sel, list);

function renderStats(v) {
  const ev = S.events, t = todayKey();
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  const mk = key(new Date(y, m, 1)).slice(0, 7);
  const monthEv = ev.filter(e => e.mulai.slice(0, 7) === mk);
  const done = monthEv.filter(e => e.status === 'Selesai').length;
  const late = ev.filter(e => e.selesai < t && e.status !== 'Selesai' && e.status !== 'Dibatalkan').length;
  const bars = (obj, colors) => { const max = Math.max(1, ...Object.values(obj)); return Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
    `<div class="hbar"><span>${esc(k)}</span><div class="tr"><i style="width:${n / max * 100}%;background:${(colors && colors[k]) || `hsl(${hue(k)} 65% 55%)`}"></i></div><b>${n}</b></div>`).join('') || '<small style="color:var(--muted)">Belum ada data</small>'; };
  const count = (arr, f) => arr.reduce((o, e) => (o[f(e)] = (o[f(e)] || 0) + 1, o), {});
  // heatmap 1 tahun terakhir
  const per = {}; ev.forEach(e => { for (let k = e.mulai; k <= e.selesai; k = addDays(k, 1)) per[k] = (per[k] || 0) + 1; });
  let hm = ''; let s = addDays(t, -364); s = addDays(s, -parse(s).getDay());
  for (let k = s; k <= t; k = addDays(k, 1)) { const n = per[k] || 0; hm += `<i title="${fmtLong(k)}: ${n} kegiatan" style="${n ? `background:var(--accent);opacity:${Math.min(1, .25 + n * .2)}` : ''}"></i>`; }
  const rate = monthEv.length ? Math.round(done / monthEv.length * 100) : 0;
  v.innerHTML = `<div class="scroll"><div class="stats">
    <div class="kpi"><small>Kegiatan ${BLN[m]}</small><b>${monthEv.length}</b></div>
    <div class="kpi"><small>Tingkat penyelesaian</small><b style="color:var(--ok)">${rate}%</b><div class="prog"><i style="width:${rate}%"></i></div></div>
    <div class="kpi"><small>Terlambat / belum selesai</small><b style="color:var(--danger)">${late}</b></div>
    <div class="kpi"><small>Lampiran di Drive</small><b>${S.files.length}</b><small>${size(S.files.reduce((a, f) => a + Number(f.ukuran || 0), 0))}</small></div>
  </div>
  <div class="panel"><h3>🔥 Peta aktivitas 12 bulan</h3><div class="heatmap">${hm}</div></div>
  <div class="grid2"><div class="panel"><h3>Per kategori (${BLN[m]})</h3>${bars(count(monthEv, e => e.kategori), CATS)}</div>
  <div class="panel"><h3>Per status (${BLN[m]})</h3>${bars(count(monthEv, e => e.status), STAT_C)}</div>
  <div class="panel"><h3>👥 Kontributor teraktif</h3>${bars(count(ev, e => e.dibuatOleh.split('@')[0]))}</div>
  <div class="panel"><h3>Prioritas</h3>${bars(count(monthEv, e => e.prioritas), PRI)}</div></div>
  <div class="panel" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-soft" onclick="exportCSV()">⬇️ Ekspor CSV (Excel)</button>
  <button class="btn btn-soft" onclick="exportICS()">📅 Ekspor .ics (Google/Outlook Calendar)</button><button class="btn btn-soft" onclick="window.print()">🖨️ Cetak</button></div></div>`;
}

/* ---------- quick add (bahasa alami) */
function parseQuick(txt) {
  let s = ' ' + txt + ' ', t = todayKey();
  const o = { mulai: t, selesai: t, seharian: true, kategori: 'Umum', prioritas: 'Sedang', status: 'Direncanakan', checklist: [], peserta: [], tautan: [] };
  const rm = re => { const m = s.match(re); if (m) s = s.replace(m[0], ' '); return m; };
  let m;
  if ((m = rm(/\s#(\w+)/))) { const c = Object.keys(CATS).find(k => k.toLowerCase() === m[1].toLowerCase()); o.kategori = c || 'Lainnya'; }
  if ((m = rm(/\s!(rendah|sedang|tinggi|penting|urgent)/i))) o.prioritas = /rendah/i.test(m[1]) ? 'Rendah' : /sedang/i.test(m[1]) ? 'Sedang' : 'Tinggi';
  if ((m = rm(/\s@([^#!]+?)(?=\s[#!]|\s*$)/))) o.lokasi = m[1].trim();
  if ((m = rm(/\s(?:jam\s)?(\d{1,2})[:.](\d{2})(?:\s*[-–sd.]+\s*(\d{1,2})[:.](\d{2}))?/i))) {
    o.seharian = false; o.jamMulai = m[1].padStart(2, '0') + ':' + m[2]; if (m[3]) o.jamSelesai = m[3].padStart(2, '0') + ':' + m[4];
  }
  if (rm(/\slusa\b/i)) o.mulai = addDays(t, 2);
  else if (rm(/\sbesok\b/i)) o.mulai = addDays(t, 1);
  else if (rm(/\shari ini\b/i)) o.mulai = t;
  else if ((m = rm(/\s(senin|selasa|rabu|kamis|jumat|sabtu|minggu)(?:\s+depan)?\b/i))) {
    const idx = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'].indexOf(m[1].toLowerCase());
    let diff = (idx - new Date().getDay() + 7) % 7 || 7; o.mulai = addDays(t, diff);
  } else if ((m = rm(/\s(?:tgl\s|tanggal\s)?(\d{1,2})[\/\s-](\d{1,2}|jan\w*|feb\w*|mar\w*|apr\w*|mei|jun\w*|jul\w*|agu\w*|sep\w*|okt\w*|nov\w*|des\w*)(?:[\/\s-](\d{4}))?\b/i))) {
    let mo = isNaN(m[2]) ? ['jan', 'feb', 'mar', 'apr', 'mei', 'jun', 'jul', 'agu', 'sep', 'okt', 'nov', 'des'].indexOf(m[2].slice(0, 3).toLowerCase()) : Number(m[2]) - 1;
    const yr = m[3] ? Number(m[3]) : new Date().getFullYear();
    if (mo >= 0) o.mulai = key(new Date(yr, mo, Number(m[1])));
  }
  o.selesai = o.mulai;
  o.judul = s.replace(/\s+/g, ' ').trim();
  return o;
}
async function quickAdd() {
  const inp = document.getElementById('quick'); if (!inp.value.trim()) return inp.focus();
  const o = parseQuick(inp.value); if (!o.judul) return toast('Tulis judul kegiatannya ya');
  inp.value = '';
  try { const e = await call('apiSaveEvent', o); toast(`✨ "${e.judul}" ditambahkan · ${fmtLong(e.mulai)} ${timeStr(e)}`, 'Buka', () => openDetail(e.id)); S.cursor = parse(e.mulai); await refresh(true); }
  catch (err) { toast('⚠️ ' + err.message); }
}

  <div class="mf">${id ? `<button class="btn btn-danger" onclick="delEvent('${id}')">🗑️ Hapus</button>` : ''}<div class="grow"></div>

    <button class="btn btn-primary" onclick="saveForm()" id="saveBtn">💾 Simpan</button></div>`);
  renderCk(); checkConflict();
}
function pick(btn, name) {
  current[name] = btn.dataset.val;
  btn.parentNode.querySelectorAll('button').forEach(b => { const on = b === btn; b.classList.toggle('on', on); const c = getComputedStyle(b).color; });
  const map = { kategori: CATS, prioritas: PRI, status: STAT_C }[name];
  btn.parentNode.querySelectorAll('button').forEach(b => { b.style.cssText = b === btn ? `background:${map[b.dataset.val]}` : `color:${map[b.dataset.val]}`; });
}
function renderCk() {
  document.getElementById('cklist').innerHTML = (current.checklist || []).map((c, i) => `<div class="chk"><input type="checkbox" ${c.d ? 'checked' : ''} onchange="current.checklist[${i}].d=this.checked">
    <div class="f" style="flex:1"><input type="text" value="${esc(c.t)}" oninput="current.checklist[${i}].t=this.value"></div><button type="button" class="icon-btn" onclick="current.checklist.splice(${i},1);renderCk()">✕</button></div>`).join('');
}
function addCk() { current.checklist.push({ t: '', d: false }); renderCk(); const ins = document.querySelectorAll('#cklist input[type=text]'); ins[ins.length - 1].focus(); }
function formData() {
  const f = document.getElementById('form'), g = n => f.elements[n];
  return Object.assign({}, current, {
    judul: g('judul').value.trim(), mulai: g('mulai').value, selesai: g('selesai').value || g('mulai').value, seharian: g('seharian').checked,
    jamMulai: g('jamMulai').value, jamSelesai: g('jamSelesai').value, lokasi: g('lokasi').value.trim(), deskripsi: g('deskripsi').value,
    peserta: g('peserta').value.split(/[,;\s]+/).map(x => x.trim().toLowerCase()).filter(x => x.includes('@')),
    tautan: g('tautan').value.split('\n').map(x => x.trim()).filter(Boolean),
    checklist: (current.checklist || []).filter(c => c.t.trim()),
  });
}
function checkConflict() {
  const d = formData(), w = document.getElementById('conflict');
  const clash = S.events.filter(e => e.id !== d.id && e.mulai <= d.selesai && e.selesai >= d.mulai && (d.seharian || e.seharian || !e.jamMulai ||
    ((d.jamMulai || '00:00') < (e.jamSelesai || '23:59') && (e.jamMulai || '00:00') < (d.jamSelesai || '23:59'))));
  w.style.display = clash.length ? 'block' : 'none';
  w.innerHTML = `⚠️ Bentrok jadwal dengan ${clash.length} kegiatan: ${clash.slice(0, 3).map(e => `<b>${esc(e.judul)}</b> (${timeStr(e)})`).join(', ')}`;
}
async function saveForm() {
  const d = formData();
  if (!d.judul) return toast('Judul wajib diisi');
  if (d.selesai < d.mulai) return toast('Tanggal selesai tidak boleh sebelum tanggal mulai');
  const b = document.getElementById('saveBtn'); b.disabled = true; b.textContent = 'Menyimpan…';
  try { const e = await call('apiSaveEvent', d); toast(d.id ? '✅ Perubahan tersimpan & tercatat di log' : '🎉 Kegiatan dibuat'); await refresh(true); openDetail(e.id, d.id ? 'detail' : 'files'); }
  catch (err) { toast('⚠️ ' + err.message); b.disabled = false; b.textContent = '💾 Simpan'; }
}
async function delEvent(id) {
  const e = S.events.find(x => x.id === id);
  if (!confirm(`Hapus "${e.judul}"?\nData tetap tersimpan di log dan bisa dipulihkan.`)) return;
  await call('apiDeleteEvent', id); closeModal();
  toast('🗑️ Kegiatan dihapus', 'Urungkan', async () => { await call('apiRestoreEvent', id); refresh(true); });
  refresh(true);
}
async function restore(id) { if (!confirm('Pulihkan kegiatan yang dihapus ini?')) return; await call('apiRestoreEvent', id); toast('♻️ Dipulihkan'); await refresh(true); openDetail(id); }

/* ---------- files: upload, hover preview & viewer */
function isImg(f) { return /^image\//.test(f.mime); }
function thumb(f, w) { return f.fileId ? `https://drive.google.com/thumbnail?id=${f.fileId}&sz=w${w || 400}` : (isImg(f) ? f.url : ''); }
function fIcon(f) { return isImg(f) ? '🖼️' : /pdf/.test(f.mime) ? '📕' : /sheet|excel|csv/.test(f.mime) ? '📗' : /word|document/.test(f.mime) ? '📘' : /presentation|powerpoint/.test(f.mime) ? '📙' : /video/.test(f.mime) ? '🎬' : /zip|rar/.test(f.mime) ? '🗜️' : '📄'; }
function fileCard(f) {
  const t = thumb(f, 300);
  return `<div class="file" data-fid="${f.id}" onmouseenter="showHover(event,'${f.id}')" onmousemove="moveHover(event)" onmouseleave="hideHover()" onclick="openViewer('${f.id}')">
    <div class="th" style="${t ? `background-image:url('${t}')` : ''}">${t ? '' : fIcon(f)}</div>
    <div class="nm">${fIcon(f)} ${esc(f.nama)}<small>${size(f.ukuran)} · ${esc(f.oleh.split('@')[0])}</small></div>
    <button class="x" title="Hapus" onclick="event.stopPropagation();delFile('${f.id}')">✕</button></div>`;
}
function showHover(ev, id) {
  if (matchMedia('(hover:none)').matches) return;
  const f = S.files.find(x => x.id === id); const h = document.getElementById('hover'); const t = thumb(f, 600);
  h.innerHTML = `${t ? `<img src="${t}" alt="">` : `<div style="font-size:60px;text-align:center;padding:30px">${fIcon(f)}</div>`}
    <div><b>${esc(f.nama)}</b><br><span style="color:var(--muted)">${size(f.ukuran)} · diunggah ${esc(f.oleh)} · ${ago(f.pada)}</span><br><span style="color:var(--accent)">Klik untuk membuka</span></div>`;
  h.style.display = 'block'; moveHover(ev);
}
function moveHover(ev) { const h = document.getElementById('hover'); const x = Math.min(ev.clientX + 18, innerWidth - 320), y = Math.min(ev.clientY + 18, innerHeight - h.offsetHeight - 10); h.style.left = x + 'px'; h.style.top = Math.max(10, y) + 'px'; }
function hideHover() { document.getElementById('hover').style.display = 'none'; }
function openViewer(id) {
  hideHover(); const f = S.files.find(x => x.id === id);
  document.getElementById('vTitle').textContent = f.nama; document.getElementById('vOpen').href = f.url;
  const b = document.getElementById('vBody');
  b.innerHTML = f.fileId ? `<iframe src="https://drive.google.com/file/d/${f.fileId}/preview" allow="autoplay"></iframe>`
    : isImg(f) ? `<img src="${f.url}">` : `<iframe src="${f.url}"></iframe>`;
  document.getElementById('viewer').classList.add('show');
}
function closeViewer() { document.getElementById('viewer').classList.remove('show'); document.getElementById('vBody').innerHTML = ''; }
async function uploadFiles(list) {
  if (!current || !current.id) return toast('Simpan kegiatan dulu');
  const id = current.id, box = document.getElementById('upl');
  for (const file of list) {
    if (file.size > S.maxUploadMb * 1048576) { toast(`⚠️ ${file.name} melebihi ${S.maxUploadMb} MB`); continue; }
    const row = document.createElement('div'); row.innerHTML = `<small>${esc(file.name)}</small><div class="prog"><i></i></div>`; box && box.appendChild(row);
    const bar = row.querySelector('i'); let p = 5; const tm = setInterval(() => { p = Math.min(92, p + (95 - p) * .08); bar.style.width = p + '%'; }, 200);
    try {
      const blob = /^image\/(jpeg|png|webp)/.test(file.type) && file.size > 1.5e6 ? await compress(file) : file;
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
      await call('apiUpload', id, file.name, blob.type || file.type || 'application/octet-stream', b64);
      bar.style.width = '100%'; toast('📎 ' + file.name + ' tersimpan di Google Drive');
    } catch (err) { toast('⚠️ Gagal unggah ' + file.name + ': ' + err.message); }
    clearInterval(tm);
  }
  await refresh(true); if (current && current.id === id) openDetail(id, 'files');
}
// kompres foto besar dari kamera HP agar upload cepat
function compress(file) {
  return new Promise(res => { const img = new Image(); img.onload = () => {
    const s = Math.min(1, 2400 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => res(b && b.size < file.size ? b : file), 'image/jpeg', .85); }; img.onerror = () => res(file); img.src = URL.createObjectURL(file); });
}
async function delFile(fid) {

function palRun(i) { closePalette(); palItems[i] && palItems[i].run(); }

function toggleTheme(force) {
  const d = force || (document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  document.documentElement.dataset.theme = d; localStorage.setItem('kkw2-theme', d);
}

document.querySelectorAll('#seg button,#bnav button[data-v]:not([data-v=more])').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closeViewer(); closePalette(); closeModal(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.getElementById('ov').classList.contains('show')) return;
  const k = e.key.toLowerCase(); const m = { n: () => openForm(), t: goToday, m: () => setView('month'), w: () => setView('week'), a: () => setView('agenda'), o: () => setView('todo'), b: () => setView('board'), s: () => setView('stats'), l: () => setView('log'), d: () => toggleTheme(), arrowleft: () => shift(-1), arrowright: () => shift(1), '/': () => document.getElementById('q').focus() };
  if (m[k]) { e.preventDefault(); m[k](); }
});
// swipe kiri/kanan di HP untuk ganti bulan
(() => { let x0 = null, y0 = null; const v = document.getElementById('view');
  v.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  v.addEventListener('touchend', e => { if (x0 === null || S.view === 'board') return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx < 0 ? 1 : -1); x0 = null; }, { passive: true }); })();

/* ============================================================ boot */
(async function init() {
  toggleTheme(localStorage.getItem('kkw2-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  S.view = localStorage.getItem('kkw2-view') || (innerWidth < 900 ? 'month' : 'month');
  // tampilkan cache lebih dulu agar terasa instan
  try { const c = JSON.parse(localStorage.getItem('kkw2-cache')); if (c && IS_GAS) { applyData(c); render(); document.getElementById('loader').remove(); } } catch (e) {}
  try {
    const d = await call('apiBootstrap');
    S.user = d.user; S.rootUrl = d.rootUrl; S.maxUploadMb = d.maxUploadMb; applyData(d);
    document.getElementById('me').outerHTML = avatar(d.user).replace('class="avatar', 'id="me" class="avatar');
    document.getElementById('driveLink').href = d.rootUrl; document.getElementById('sheetLink').href = d.sheetUrl;
    if (!IS_GAS) toast('🧪 Mode DEMO — data disimpan di browser ini saja. Deploy ke Apps Script untuk mode tim.');
  } catch (e) { toast('⚠️ Gagal memuat: ' + e.message); }
  const l = document.getElementById('loader'); l && l.remove();
  render();
  // sinkron realtime: cek versi tiap 15 dtk (lebih jarang saat tab tidak aktif)
  const live = document.getElementById('live');
  setInterval(async () => {
    if (document.hidden) return;
    try { const v = await call('apiVersion'); live.classList.remove('off'); if (v !== S.version) refresh(); }
    catch (e) { live.classList.add('off'); }
  }, 15000);
  setInterval(() => { if (S.view === 'month' || S.view === 'agenda') renderSide(); }, 60000);
})();
</script>
