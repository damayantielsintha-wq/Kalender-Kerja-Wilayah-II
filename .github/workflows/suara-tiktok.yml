name: Buat suara AI TikTok BHP
on:
  push:
    paths: ['tiktok-bhp/naskah-vo.json', 'tiktok-bhp/buat_suara.py', '.github/workflows/suara-tiktok.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  suara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install edge-tts
      - run: python tiktok-bhp/buat_suara.py
      - name: Commit rekaman
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiktok-bhp/vo
          git diff --cached --quiet || (git commit -m "Rekaman suara AI neural (otomatis)" && git push)
