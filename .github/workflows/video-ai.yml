name: Buat video kartun AI (Veo)
on:
  push:
    paths: ['kartun-ai/permintaan.json']
  workflow_dispatch:
    inputs:
      ep:
        description: 'Nomor episode'
        default: '1'
      shots:
        description: 'Adegan (mis. s2 atau s1,s2). Kosong = semua'
        default: 's2'
permissions:
  contents: write
concurrency: video-ai-${{ github.ref }}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow
      - name: Baca permintaan
        id: req
        run: |
          EP="${{ inputs.ep }}"; SHOTS="${{ inputs.shots }}"
          if [ -z "$EP" ] && [ -f kartun-ai/permintaan.json ]; then
            EP=$(python -c "import json;print(json.load(open('kartun-ai/permintaan.json'))['ep'])")
            SHOTS=$(python -c "import json;print(json.load(open('kartun-ai/permintaan.json')).get('shots',''))")
          fi
          echo "ep=${EP:-1}" >> "$GITHUB_OUTPUT"; echo "shots=$SHOTS" >> "$GITHUB_OUTPUT"
      - run: python kartun-ai/buat_video.py --ep "${{ steps.req.outputs.ep }}" --shots "${{ steps.req.outputs.shots }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Simpan klip
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kartun-ai/klip kartun-ai/gambar
          git diff --cached --quiet || (git commit -m "Klip kartun AI ep${{ steps.req.outputs.ep }} ${{ steps.req.outputs.shots }} [skip ci]" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
