<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Penyumpahan BHP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1f2e;--mut:#6b7087;--line:#e3e5ef;--pri:#4f46e5;--pri2:#eef0ff;--ok:#0f9d6b;--warn:#c2410c;--rad:14px}
:root[data-theme=dark]{--bg:#10121a;--card:#1a1d29;--ink:#e8eaf3;--mut:#9398ae;--line:#2a2e3e;--pri:#8b83ff;--pri2:#24264a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
header h1 span{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.item{padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--pri);background:var(--pri2)}
.item b{display:block;font-size:13px}.item small{color:var(--mut)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border-radius:99px;font-size:13px}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h3{margin:4px 0 12px;font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.child{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:13px}.doc div{display:flex;gap:6px}
.doc button{flex:1;padding:6px;font-size:12px}
#prev{background:#8a8fa3;padding:20px;border-radius:var(--rad);overflow:auto;max-height:80vh}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 20px;padding:48pt 48pt 48pt 71pt;font:12pt/1.5 Arial,"Liberation Sans",Helvetica,sans-serif;box-shadow:0 4px 20px #0003}
.paper p{margin:0;text-align:justify;text-indent:36pt}
.paper p.ni,.paper p.ctr{text-indent:0}.paper p.ctr,.paper .ctr{text-align:center}
table.kop{width:100%;border-collapse:collapse;border-bottom:1.25pt solid #000;margin:0 0 12pt}
.paper table.hd td:first-child{padding-left:0}.paper table.hd td:last-child{padding-right:0}
table.kop td{padding:0 0 3pt;vertical-align:middle}
table.kop td.lg{width:62pt;padding:0}
table.kop td.lg img{width:58pt;height:65pt;display:block}
table.kop td.tx{text-align:center;line-height:1.15;font-size:12pt}
table.kop .b{font-weight:bold}table.kop .s{font-size:10pt}
.paper table{border-collapse:collapse}.paper td{vertical-align:top;padding:1pt 4pt}
.ctr{text-align:center}.ttd{width:100%;margin-top:20pt}.ttd td{width:50%;text-align:center}
.paper ol{margin:0 0 8pt;padding-left:20pt}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.paper{box-shadow:none;margin:0;page-break-after:always}}
body.locked header,body.locked .wrap{display:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:0 16px}
.log{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.logi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ld{margin-top:4px;font-size:13px}.dif{margin:0;padding-left:18px}
del{color:#b91c1c;text-decoration:line-through}ins{color:#047857;text-decoration:none;font-weight:600}
.meta{font-size:12px;color:var(--mut)}
.nomor{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--pri2)}
.kurang{font-size:11px;color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>⚖️ Dokumen Penyumpahan <span>BHP Medan</span></h1>
  <input id="q" placeholder="Cari nama…" style="width:170px">
  <button onclick="newRec()" class="pri">+ Data baru</button>
  <label class="btn pri" style="margin:0">📑 Upload Penetapan<input type="file" accept=".pdf,image/*" hidden onchange="uploadPenetapan(this)"></label>
  <label class="btn" style="margin:0;color:var(--ink)">⬆ Impor CSV<input type="file" accept=".csv" hidden onchange="importCsv(this)"></label>
  <button class="superOnly" onclick="riwayatSemua()">🕘 Riwayat</button>
  <button class="superOnly" onclick="kelolaPengguna()">👥 Pengguna</button>
  <button class="superOnly" onclick="openSet()">⚙ Pengaturan</button>
  <button onclick="toggleTheme()" title="Tema">🌓</button>
  <span id="who"></span>
</header>

<div class="wrap">
  <aside class="card">
    <h3>Daftar Berkas</h3>
    <div class="list" id="list"></div>
  </aside>

  <main class="card" id="main"></main>
</div>
<div id="login" hidden></div>
<dialog id="gDlg" oncancel="if(this.dataset.lock)event.preventDefault()" style="border:0;border-radius:16px;padding:0;max-width:860px;width:95%;background:var(--card);color:var(--ink)"><div style="padding:18px" id="gBody"></div></dialog>
<div class="toast" id="toast"></div>

<dialog id="penDlg" style="border:0;border-radius:16px;padding:0;max-width:760px;width:95%;background:var(--card);color:var(--ink)"><div style="padding:18px" id="penBody"></div></dialog>
<dialog id="setDlg" style="border:0;border-radius:16px;padding:0;max-width:720px;width:95%;background:var(--card);color:var(--ink)">
  <div style="padding:18px" id="setBody"></div>
</dialog>

/* ---------------- util tanggal & terbilang ---------------- */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function today(){const d=new Date(Date.now()+7*3600e3);return d.toISOString().slice(0,10)}
function pd(s){if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function tgl(s){const d=pd(s);return d?`${String(d.getDate()).padStart(2,'0')} ${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'}
function hari(s){const d=pd(s);return d?HARI[d.getDay()]:'…'}
function usia(s,ref){const d=pd(s);if(!d)return'…';const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u+' Tahun'}
function terbilang(n){const s=['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if(n<12)return s[n];if(n<20)return terbilang(n-10)+' Belas';if(n<100)return terbilang(Math.floor(n/10))+' Puluh '+terbilang(n%10);
  if(n<200)return'Seratus '+terbilang(n-100);if(n<1000)return terbilang(Math.floor(n/100))+' Ratus '+terbilang(n%100);
  if(n<2000)return'Seribu '+terbilang(n-1000);return terbilang(Math.floor(n/1000))+' Ribu '+terbilang(n%1000)}
const tb=n=>terbilang(n).replace(/\s+/g,' ').trim();
function tglBA(s){const d=pd(s);return d?`${HARI[d.getDay()]}, tanggal ${tb(d.getDate())} bulan ${BLN[d.getMonth()]} tahun ${tb(d.getFullYear())}`:'…'}
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=v=>v?esc(v):'<span style="background:#fde68a">……</span>';

/* ---------------- turunan ---------------- */
function pjCari(v){const P=SET.pejabat||[];if(typeof v==='number')return P[v]||{};return P.find(p=>p.nama===v)||{nama:v||'',nip:'',jabatan:''}}
function derive(r){
  const w=r.jenis==='Perwalian', J=w?'Wali':'Pengampu';
  const sapa=r.jk==='Laki-laki'?'Bapak':'Ibu';
  const anak=w?r.anak.filter(a=>a.nama):[];
  const objek=w?anak.map(a=>a.nama).join(', '):r.terampu.nama;
  const statusRel=r.status||(w?'Anak':'Keluarga');
  const kel=r.kelurahan||'';
  let laf=(SET.lafaz[r.agama]||SET.lafaz.Islam).replace('{JENIS}',w?'Perwalian':'Pengampuan')
    .replace('{STATUS}',statusRel.toLowerCase()).replace('{PENGADILAN}',r.pengadilan);
  return{w,J,sapa,objek,statusRel,kel,laf,madya:pjCari(r.madya),muda:pjCari(r.muda),anak,
    pihak:w?'Anak':'Terampu',jenisTxt:w?'Perwalian':'Pengampuan'};

const kop=()=>`<table class="kop"><tr><td class="lg"><img src="${SET.logo||LOGO_DEF}" width="77" height="87" alt="logo"></td><td class="tx">${esc(SET.instansi)}<br>${esc(SET.kanwil)}<br><span class="b">${esc(SET.balai)}</span><br><span class="s">${esc(SET.alamat)}<br>${esc(SET.telp)}<br>${esc(SET.web)}</span></td></tr></table>`;
/* ---------------- dokumen (sesuai template di folder Drive BHP Medan) ---------------- */
function head(no,hal,r){return `<table class="hd" style="width:100%;margin-bottom:12pt"><tr><td style="width:70pt">Nomor</td><td>:</td><td>${V(no)}</td><td style="text-align:right">${tgl(r.tanggalSurat)}</td></tr>
<tr><td>Sifat</td><td>:</td><td>Segera</td><td></td></tr><tr><td>Lampiran</td><td>:</td><td>-</td><td></td></tr>
<tr><td>Hal</td><td>:</td><td colspan=2>${hal}</td></tr></table>`}
const jadwal=(r,note)=>`<table style="margin:0 0 10pt 20pt"><tr><td style="width:90pt">Hari/Tanggal</td><td>:</td><td>${hari(r.tglSumpah)} / ${tgl(r.tglSumpah)}</td></tr>
<tr><td>Pukul</td><td>:</td><td>${V(r.waktu)}${note?` (${note} <b>${esc(SET.wa)}</b>)`:''}</td></tr><tr><td>Tempat</td><td>:</td><td>${esc(r.tempat||'Kediaman '+(r.nama||''))}</td></tr></table>`;
const ttdKepala=()=>`<p class="ni" style="margin-left:262pt;margin-top:20pt;text-align:left">Kepala,<br><br><br><br><b>${esc(SET.kepala)}</b></p>`;
const kanwil=r=>r.kanwilTembusan||SET.kanwilTembusan;
const tembusan=(r,lurah=true)=>`<p class="ni" style="margin-top:18pt">Tembusan:</p><ol><li>Direktur Jenderal Administrasi Hukum Umum Kementerian Hukum RI;</li><li>Direktur Perdata Direktorat Jenderal Administrasi Hukum Umum;</li><li>${esc(kanwil(r))}${lurah?';':''}</li>${lurah?`<li>Lurah ${V(r.kelurahan)}</li>`:''}</ol>`;
const penetapan=r=>`Menindaklanjuti Penetapan ${esc(r.pengadilan)} Nomor: ${V(r.nomorPenetapan)} tertanggal ${tgl(r.tglPenetapan)} yang telah memperoleh kekuatan hukum tetap`;
const blnThn=s=>{const d=pd(s);return d?`${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'};
const kota=r=>r.kotaPermohonan||((r.kelurahan||'').match(/(?:Kota|Kabupaten|Kab\.)\s+([^,]+)/i)||[])[1]||'Medan';
const tempatTgl=r=>`${esc(kota(r))},&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${blnThn(r.tglSumpah)}`;
const bapP=r=>pjCari(r.bapOleh===undefined?r.muda:r.bapOleh);
const ttd2=(kiri,kanan,namaKiri,namaKanan,nipKiri,nipKanan)=>`<table class="ttd" style="margin-top:18pt"><tr><td><b>${kiri}</b></td><td><b>${kanan}</b></td></tr><tr><td style="height:60pt"></td><td></td></tr>
<tr><td><b>${namaKiri}</b>${nipKiri?`<br><b>NIP. ${nipKiri}</b>`:''}</td><td><b>${namaKanan}</b>${nipKanan?`<br><b>NIP. ${nipKanan}</b>`:''}</td></tr></table>`;
const saksi=r=>`<table class="ttd" style="margin-top:24pt"><tr><td><b>Saksi 1</b></td><td><b>Saksi 2</b></td></tr><tr><td style="height:50pt"></td><td></td></tr>
<tr><td>( ${esc(r.saksi1)||'.............................'} )<br>NIK.</td><td>( ${esc(r.saksi2)||'.............................'} )<br>NIK.</td></tr></table>`;
const identitas=r=>`${esc(r.jk)}, Lahir tanggal ${tgl(r.tglLahir)} (${usia(r.tglLahir,r.tglSumpah)}), agama ${esc(r.agama)}, Pekerjaan ${V(r.pekerjaan)}, alamat ${V(r.alamat)}`;
function objekBA(r,d){
  if(d.w){const l=d.anak.map(a=>`<b>${esc(a.nama)}</b>, ${esc(a.jk)}, lahir pada tanggal ${tgl(a.tglLahir)} (${usia(a.tglLahir,r.tglSumpah)})`);

const GAS=typeof google!=='undefined'&&google.script&&google.script.run;
let FOLDER='',TOKEN=null,ME=null,USERS=[],SPS={terhubung:false},ADA_AI=false,DB=[],SET=JSON.parse(JSON.stringify(DEF_SET));
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}};
function api(fn,...a){
  if(!GAS)return new Promise((ok,no)=>setTimeout(()=>{try{ok(DEMO[fn](TOKEN,...a))}catch(e){no(e)}},60));
  return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{if(/SESI_HABIS/.test(e.message||e)){sesiHabis();no(new Error('Sesi berakhir, silakan login lagi.'))}else no(e)})[fn](TOKEN,...a))}
function apiLoginCall(u,p){if(!GAS)return new Promise((ok,no)=>{try{ok(DEMO.apiLogin(u,p))}catch(e){no(e)}});
  return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).apiLogin(u,p))}
const isSuper=()=>ME&&ME.role==='superadmin';
function sesiHabis(){TOKEN=null;ss('bhpTok',null);showLogin('Sesi berakhir, silakan login lagi.')}
function showLogin(msg){
  document.body.classList.add('locked');
  $('#login').innerHTML=`<form class="card" onsubmit="event.preventDefault();doLogin(this)" style="max-width:380px;margin:12vh auto;padding:28px">
    <div style="text-align:center;margin-bottom:14px"><img src="${LOGO_DEF}" style="height:64px"><h2 style="margin:10px 0 2px;font-size:18px">Dokumen Penyumpahan</h2><span class="hint">Balai Harta Peninggalan Medan</span></div>
    ${msg?`<p style="color:var(--warn);font-size:13px">${esc(msg)}</p>`:''}
    <label>Username</label><input name="u" autocomplete="username" required autofocus>
    <label style="margin-top:10px">Password</label><input name="p" type="password" autocomplete="current-password" required>
    <button class="pri" style="width:100%;margin-top:16px">Masuk</button>
    ${GAS?'':'<p class="hint" style="margin-top:12px">Mode demo (belum di-deploy): username <b>shela</b> atau <b>annisa</b>, password <b>demo</b>.</p>'}</form>`;
  $('#login').hidden=false}
async function doLogin(f){const b=f.querySelector('button');b.disabled=true;b.textContent='Memeriksa…';
  try{const r=await apiLoginCall(f.u.value,f.p.value);TOKEN=r.token;ss('bhpTok',TOKEN);await boot()}
  catch(e){showLogin(e.message||String(e))}}
async function boot(){
  if(!TOKEN){showLogin();return}
  try{const r=await api('apiInit');ME=r.user;USERS=r.users||[];SPS=r.sps||SPS;SET=Object.assign(JSON.parse(JSON.stringify(DEF_SET)),r.settings||{});DB=r.berkas||[];FOLDER=r.folderUrl||'';
    DB.sort((a,b)=>String(b._meta?.diubahPada||'').localeCompare(String(a._meta?.diubahPada||'')));
    api('apiAdaGemini').then(v=>ADA_AI=v).catch(()=>{});
  }catch(e){if(!TOKEN)return;showLogin(e.message);return}
  $('#login').hidden=true;document.body.classList.remove('locked');renderHeader();cur=null;renderList();renderMain();
  if(ME.wajibGanti)gantiPassword(true)}
async function logout(){await api('apiLogout').catch(()=>{});TOKEN=null;ss('bhpTok',null);ME=null;DB=[];cur=null;showLogin('Anda sudah keluar.')}

function gantiPassword(wajib){dlg(`<form onsubmit="event.preventDefault();simpanPwd(this)"><h3>🔑 ${wajib?'Buat password baru (wajib saat login pertama)':'Ganti password'}</h3>

  <p style="text-align:right">${wajib?'':'<button type="button" onclick="dlgClose()">Batal</button> '}<button class="pri">Simpan</button></p></form>`,wajib)}
async function simpanPwd(f){const e=f.querySelector('.err');if(f.b.value!==f.c.value){e.textContent='Password baru tidak sama.';return}
  try{await api('apiGantiPassword',f.a.value,f.b.value);ME.wajibGanti=false;dlgClose();toast('Password diganti')}catch(x){e.textContent=x.message}}
function dlg(h,modal){const d=$('#gDlg');$('#gBody').innerHTML=h;d.dataset.lock=modal?'1':'';if(!d.open)d.showModal()}

/* ---------------- simpan otomatis ke server (dengan cek bentrok) ---------------- */
let saveT=null,saving=false,again=false;
function save(){if(!cur)return;setStat('✎ Belum tersimpan…');clearTimeout(saveT);saveT=setTimeout(flush,900)}
async function flush(){if(!cur)return;if(saving){again=true;return}saving=true;const r0=cur;
  try{const r=await api('apiSimpan',JSON.parse(JSON.stringify(r0)),r0._versi);
    if(r.konflik){alert(`Berkas ini baru saja diubah oleh ${r.oleh}. Data terbaru dimuat ulang; ulangi perubahan Anda bila perlu.`);
      const i=DB.indexOf(r0);const s=r.server;s._meta=r0._meta;DB[i]=s;if(cur===r0)cur=s;renderMain();renderList()}
    else{r0._versi=r.versi;if(r.diubahOleh)r0._meta={...(r0._meta||{dibuatOleh:ME.nama,dibuatPada:r.diubahPada}),diubahOleh:r.diubahOleh,diubahPada:r.diubahPada};delete r0.asal;setStat('✓ Tersimpan')}}
  catch(e){setStat('⚠ Gagal menyimpan');toast(e.message)}
  saving=false;if(again){again=false;flush()}}
function setStat(t){const e=$('#stat');if(e)e.textContent=t}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function addRec(r,asal){r.id=r.id||newId();r.asal=asal;r._meta={dibuatOleh:ME.nama,dibuatPada:new Date().toISOString(),diubahOleh:ME.nama,diubahPada:new Date().toISOString()};DB.unshift(r);return r}

const fLbl=f=>{const m=f.match(/^anak\.(\d+)\.(\w+)$/);if(m)return`Anak ${+m[1]+1} – ${{nama:'nama',jk:'JK',tglLahir:'tgl lahir'}[m[2]]||m[2]}`;return LBL[f]||f};
const wkt=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
function detailHtml(x){let d=x.detail||'';const [j,rest]=d.split(' | ');
  try{const a=JSON.parse(j);if(Array.isArray(a))return`<ul class="dif">${a.map(c=>`<li><b>${esc(fLbl(c.f))}</b>: <del>${esc(String(c.dari).slice(0,120))||'∅'}</del> → <ins>${esc(String(c.ke).slice(0,160))||'∅'}</ins></li>`).join('')}</ul>${rest?`<small>${esc(rest)}</small>`:''}`}catch(e){}
  return esc(d)}
function riwayatRows(list,showBerkas){return list.length?`<div class="log">${list.map(x=>{const a=AKSI[x.aksi]||['•',x.aksi];
  return`<div class="logi"><div class="lh"><span>${a[0]}</span><b>${esc(x.nama)}</b><span class="hint">${a[1]}</span>${showBerkas&&x.berkas?`<a href="#" onclick="event.preventDefault();dlgClose();pick('${x.berkasId}')">${esc(x.berkas)}</a>`:''}<span class="hint" style="margin-left:auto">${wkt(x.waktu)}</span></div>${x.detail?`<div class="ld">${detailHtml(x)}</div>`:''}</div>`}).join('')}</div>`:'<p class="hint">Belum ada catatan.</p>'}
async function tabRiwayat(){const el=$('#riw');el.innerHTML='<p class="hint">Memuat riwayat…</p>';
  try{el.innerHTML=riwayatRows(await api('apiRiwayat',{berkasId:cur.id}),false)}catch(e){el.innerHTML=`<p class="hint">${esc(e.message)}</p>`}}
async function riwayatSemua(f={}){if(!isSuper())return;
  const us=USERS.map(u=>`<option value="${u.username}" ${f.username===u.username?'selected':''}>${esc(u.nama)}</option>`).join('');

  <div><label>Aksi</label><select id="fa"><option value="">Semua aksi</option>${ak}</select></div><div><label>Cari</label><input id="fq" value="${esc(f.q||'')}" placeholder="nama berkas / isi"></div>

const NOMOR={surat:'nomorSurat',lurah:'nomorLurah',bap:'nomorBAP',ba:'nomorBA',harta:'nomorBAHarta'};
function kurang(k,r){const d=derive(r),m=[];const need=(v,l)=>{if(!String(v??'').trim())m.push(l)};
  need(r.pengadilan,'Pengadilan');need(r.nomorPenetapan,'Nomor penetapan');need(r.tglPenetapan,'Tanggal penetapan');need(r.nama,'Nama '+d.J);need(r.alamat,'Alamat');need(r.kelurahan,'Kelurahan');need(r.tglSumpah,'Tanggal sumpah');need(r.waktu,'Waktu');
  if(d.w){if(!d.anak.length)m.push('Data anak')}else need(r.terampu.nama,'Nama terampu');
  if(k==='surat'||k==='lurah')need(r.tanggalSurat,'Tanggal surat');
  if(k==='ba'){need(r.tglLahir,'Tgl lahir '+d.J);need(r.agama,'Agama');need(r.pekerjaan,'Pekerjaan');need(r.status,'Hubungan');need(d.madya.nama,'Nama pejabat madya');need(d.madya.nip,'NIP pejabat madya');
    if(d.w)d.anak.forEach((a,i)=>need(a.tglLahir,`Tgl lahir anak ${i+1}`));else{need(r.terampu.tglLahir,'Tgl lahir terampu');need(r.terampu.kondisi,'Kondisi medis')}}
  if(k==='harta'){need(d.muda.nama,'Nama pejabat inventarisasi');need(d.muda.nip,'NIP pejabat inventarisasi');need(r.tglLahir,'Tgl lahir '+d.J);need(r.pekerjaan,'Pekerjaan')}
  if(k==='bap'){const p=bapP(r);need(p.nama,'Nama pejabat BAP');need(p.nip,'NIP pejabat BAP');need(r.isiBap,'Isi BAP');need(r.tglLahir,'Tgl lahir '+d.J);need(r.pekerjaan,'Pekerjaan')}
  return m}
function infoNomor(k,r){const d=derive(r);return{kurang:kurang(k,r),
  perihal:{surat:`Pengambilan Sumpah ${d.J} dan Inventarisasi Harta`,lurah:'Koordinasi Terkait Pengambilan Sumpah dan Inventarisasi Harta',bap:`Berita Acara Penghadapan ${d.jenisTxt} an. ${r.nama}`,ba:`Berita Acara Penyumpahan ${d.jenisTxt} an. ${r.nama}`,harta:`Berita Acara Pencatatan Harta ${d.jenisTxt} an. ${r.nama}`}[k],
  tujuan:k==='lurah'?'Lurah '+r.kelurahan:r.nama,tanggal:k==='surat'||k==='lurah'?r.tanggalSurat:r.tglSumpah}}
async function ambilNomor(k,btn){const inf=infoNomor(k,cur);if(inf.kurang.length){alert('Lengkapi dulu: '+inf.kurang.join(', '));return}
  if(!confirm(`Ambil nomor SPS (${cur.jenis==='Perwalian'?'AH.06.02':'AH.06.03'}, tanggal hari ini ${tgl(today())}${k==='surat'||k==='lurah'?' — tanggal surat ikut disesuaikan':''}) untuk "${DOCS[k].nama(cur)}"?\nPerihal: ${inf.perihal}\n\nNomor yang sudah diambil tidak bisa dibatalkan dari aplikasi ini.`))return;
  btn.disabled=true;btn.textContent='Menghubungi SPS…';clearTimeout(saveT);await flush();
  try{const r=await api('apiAmbilNomor',cur.id,NOMOR[k],inf);cur[NOMOR[k]]=r.nomor;cur._versi=r.versi;if(r.tanggalSurat)cur.tanggalSurat=r.tanggalSurat;toast('Nomor: '+r.nomor);renderMain()}
  catch(e){alert('Gagal mengambil nomor: '+(e.message||e));btn.disabled=false;btn.textContent='🔢 Ambil nomor SPS'}}

      const a=flat(old),b=flat(rec),dif=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>k!=='id'&&(a[k]||'')!==(b[k]||'')).map(f=>({f,dari:a[f]||'',ke:b[f]||''}));

  const b64=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(file)});
  const prompt=`Anda asisten Balai Harta Peninggalan (BHP) Medan. Baca PENETAPAN PENGADILAN terlampir (perwalian anak atau pengampuan orang dewasa) dan ekstrak data untuk Berita Acara Penyumpahan.
Balas HANYA JSON dengan kunci berikut (string kosong bila tidak ada di dokumen, jangan mengarang):
{"jenis":"Pengampuan|Perwalian","pengadilan":"mis. Pengadilan Negeri Pekanbaru","nomorPenetapan":"mis. 48/Pdt.P/2025/PN Pbr","tglPenetapan":"YYYY-MM-DD",
"nama":"pemohon yang DITETAPKAN sebagai wali/pengampu, HURUF KAPITAL tanpa gelar sapaan","nik":"16 digit","jk":"Laki-laki|Perempuan","tglLahir":"YYYY-MM-DD","agama":"Islam|Kristen|Katholik|Hindu|Buddha|Khonghucu",
"pekerjaan":"","alamat":"alamat lengkap pemohon seperti tertulis (RT/RW, kelurahan, kecamatan, kota, provinsi)","kelurahan":"format: Kelurahan X, Kecamatan Y, Kota/Kabupaten Z, Provinsi",
"status":"hubungan TERAMPU/ANAK terhadap pemohon, Title Case, mis. Ibu Kandung, Istri, Saudara Kandung, Anak Kandung",
"terampu":{"nama":"KAPITAL","jk":"Laki-laki|Perempuan","tglLahir":"YYYY-MM-DD","kondisi":"diagnosis medis + dasar surat keterangan dokter (nama RS & nomor surat) bila ada"},
"anak":[{"nama":"KAPITAL","jk":"Laki-laki|Perempuan","tglLahir":"YYYY-MM-DD"}],
"isiBap":["kalimat keterangan untuk Berita Acara Penghadapan, masing-masing diawali \"Bahwa\" dan diakhiri titik koma, disusun dari duduk perkara/fakta hukum penetapan: perkawinan/hubungan keluarga beserta nomor akta, kematian orang tua/suami bila ada, anak-anak/terampu beserta akta kelahiran, kondisi medis & surat dokter, aset yang dimiliki (jenis, luas, lokasi, nomor sertifikat, atas nama), tujuan permohonan (mis. menjual/menjaminkan aset), dan penetapan pengadilan yang mengangkat pemohon; gunakan sebutan \"penghadap\" untuk pemohon; 4-8 kalimat"]}
Aturan: ambil nomor & tanggal dari bagian kepala dan penutup penetapan (bukan footer halaman). Tanggal penetapan = tanggal "Demikianlah ditetapkan". Tanggal format 26-06-1982 berarti 26 Juni 1982.
Untuk Pengampuan isi "terampu" dan kosongkan "anak"; untuk Perwalian isi semua anak yang disebut di amar dan kosongkan "terampu". Jenis kelamin boleh disimpulkan dari hubungan (Ibu/Istri = Perempuan).`;
  const d=await api('apiBacaPenetapanAI',b64,file.type||'application/pdf',prompt);if(!d)throw new Error('AI tidak aktif');d._ai=true;return d}

const PEN_LBL={jenis:'Jenis',pengadilan:'Pengadilan',nomorPenetapan:'Nomor Penetapan',tglPenetapan:'Tanggal Penetapan',nama:'Nama Pemohon (Wali/Pengampu)',nik:'NIK',jk:'Jenis Kelamin',tglLahir:'Tanggal Lahir',agama:'Agama',pekerjaan:'Pekerjaan',alamat:'Alamat',kelurahan:'Kelurahan/Kec/Kota',status:'Hubungan'};
let PEN=null;
function reviewPenetapan(d,fname){PEN=d;const w=d.jenis==='Perwalian';
  const row=(k,lbl,v,type='text')=>`<div><label>${lbl}</label><input type="${type}" value="${esc(v||'')}" data-pk="${k}" style="${v?'':'background:#fde68a33;border-color:#f59e0b'}"></div>`;
  let h=`<h3>📑 Hasil baca: ${esc(fname)} ${d._ai?'<span class="tag">AI</span>':''}</h3><p class="hint">Periksa & koreksi dulu. Kolom oranye = tidak ditemukan di dokumen.</p><div class="grid">`;
  h+=`<div><label>Jenis</label><select data-pk="jenis">${['Pengampuan','Perwalian'].map(j=>`<option ${j===d.jenis?'selected':''}>${j}</option>`).join('')}</select></div>`;
  ['pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','status'].forEach(k=>h+=row(k,PEN_LBL[k],d[k],/^tgl/.test(k)?'date':'text'));
  h+=`<div class="full">${row('alamat','Alamat',d.alamat)}</div><div class="full">${row('kelurahan','Kelurahan, Kecamatan, Kota',d.kelurahan)}</div>`;
  if(w)(d.anak||[]).forEach((a,i)=>h+=row(`anak.${i}.nama`,`Anak ${i+1}`,a.nama)+row(`anak.${i}.tglLahir`,'Tgl lahir',a.tglLahir,'date')+row(`anak.${i}.jk`,'JK',a.jk));
  else{const t=d.terampu||{};h+=row('terampu.nama','Nama Terampu',t.nama)+row('terampu.tglLahir','Tgl Lahir Terampu',t.tglLahir,'date')+row('terampu.jk','JK Terampu',t.jk)+`<div class="full">${row('terampu.kondisi','Kondisi medis',t.kondisi)}</div>`}
  h+=`</div>${d._text?`<details style="margin-top:10px"><summary class="hint">Lihat teks hasil baca</summary><pre style="white-space:pre-wrap;max-height:200px;overflow:auto;font-size:11px">${esc(d._text)}</pre></details>`:''}
  <p style="text-align:right;display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button onclick="penDlg.close()">Batal</button><button class="pri" onclick="applyPenetapan()">✔ Terapkan ke berkas</button></p>`;
  $('#penBody').innerHTML=h;if(!$('#penDlg').open)$('#penDlg').showModal()}
function applyPenetapan(){
  $('#penBody').querySelectorAll('[data-pk]').forEach(e=>{const ks=e.dataset.pk.split('.');let o=PEN;ks.slice(0,-1).forEach((k,i)=>{o[k]=o[k]??(/^\d+$/.test(ks[i+1])?[]:{});o=o[k]});o[ks.at(-1)]=e.value.trim()});
  let r=(penFill&&cur&&!cur._dihapus)?cur:null;const baru=!r;if(!r)r=addRec(blank(),'Dibuat dari upload penetapan '+(PEN.nomorPenetapan||''));
  ['jenis','pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','alamat','kelurahan','status','isiBap'].forEach(k=>{if(PEN[k])r[k]=PEN[k]});
  if(PEN.kelurahan)r._kelManual=true;
  if(PEN.jenis==='Perwalian'){const a=(PEN.anak||[]).filter(x=>x&&x.nama).map(x=>({nama:x.nama,jk:/perem/i.test(x.jk)?'Perempuan':'Laki-laki',tglLahir:x.tglLahir||''}));if(a.length)r.anak=a}
  else if(PEN.terampu){const t=PEN.terampu;r.terampu={nama:t.nama||'',jk:/perem/i.test(t.jk)?'Perempuan':'Laki-laki',tglLahir:t.tglLahir||'',kondisi:t.kondisi||''}}
  cur=r;tab='jadwal';penDlg.close();renderList();renderMain();if(baru)flush();else save();api('apiCatat','BACA_PENETAPAN',r.id,r.nama,'Isian diambil dari penetapan '+(PEN.nomorPenetapan||'')+(PEN._ai?' (AI)':'')).catch(()=>{});toast('Data penetapan diterapkan — lanjut isi jadwal sumpah')}

  dlg(`<h3>⚙ Pengaturan <span class="tag">Admin Utama</span></h3><div class="grid">

  <div class="full card" style="padding:12px"><h3>🔢 Koneksi SPS (sps.batamen.com)</h3>
    <p class="hint">Status: ${SPS.terhubung?'<b style="color:var(--ok)">tersimpan</b>':'<b style="color:var(--warn)">belum diisi</b>'}${SPS.cookie?' · cookie':''}${SPS.akun?' · akun':''}. Nomor diambil dengan kode <b>AH.06.03</b> (pengampuan) / <b>AH.06.02</b> (perwalian), nama pegawai = admin yang login. Kredensial disimpan di server, tidak terlihat admin lain.</p>

    <div><button onclick="simpanSps()">Simpan kredensial</button></div><div><button onclick="tesSps(this)">🔌 Tes koneksi</button></div></div></div>
  <div class="full card" style="padding:12px"><h3>✨ AI Gemini untuk membaca penetapan</h3><p class="hint">Status: ${ADA_AI?'<b style="color:var(--ok)">terhubung</b>':'<b style="color:var(--warn)">belum terhubung</b>'}. Buat kunci gratis di <a href="https:\/\/aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (login dengan akun Google Anda), lalu tempel di sini. Kunci disimpan di server, tidak terlihat admin lain.</p><div class="grid"><div><label>Gemini API key</label><input id="gk" type="password" autocomplete="new-password"></div><div><label>&nbsp;</label><button onclick="simpanGemini()">Simpan kunci</button></div><div><label>&nbsp;</label><button onclick="tesGemini(this)">🔌 Tes Gemini</button></div></div></div>
  </div><p style="text-align:right;margin-top:12px"><button onclick="dlgClose();boot()">Batal</button> <button class="pri" onclick="simpanSet()">Simpan pengaturan</button></p>`)}
function gantiLogo(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,300/img.height);c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);SET.logo=c.toDataURL('image/png');openSet()};img.src=URL.createObjectURL(f)}
async function sinkronPegawai(b){b.disabled=true;b.textContent='Membaca sheet…';try{const p=await api('apiSinkronPegawai','');SET.pejabat=p;toast(p.length+' pegawai dimuat');openSet()}catch(e){alert('Gagal: '+(e.message||e));b.disabled=false}}
