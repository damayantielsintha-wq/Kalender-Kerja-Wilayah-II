<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Penyumpahan BHP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1f2e;--mut:#6b7087;--line:#e3e5ef;--pri:#4f46e5;--pri2:#eef0ff;--ok:#0f9d6b;--warn:#c2410c;--rad:14px}
:root[data-theme=dark]{--bg:#10121a;--card:#1a1d29;--ink:#e8eaf3;--mut:#9398ae;--line:#2a2e3e;--pri:#8b83ff;--pri2:#24264a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
header h1 span{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.item{padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--pri);background:var(--pri2)}
.item b{display:block;font-size:13px}.item small{color:var(--mut)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border-radius:99px;font-size:13px}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h3{margin:4px 0 12px;font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.child{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:13px}.doc div{display:flex;gap:6px}
.doc button{flex:1;padding:6px;font-size:12px}
#prev{background:#8a8fa3;padding:20px;border-radius:var(--rad);overflow:auto;max-height:80vh}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 20px;padding:48pt 48pt 48pt 71pt;font:12pt/1.5 Arial,"Liberation Sans",Helvetica,sans-serif;box-shadow:0 4px 20px #0003}
.paper p{margin:0 0 6pt;text-align:justify;text-indent:36pt}
.paper p.ni,.paper p.ctr{text-indent:0}.paper p.ctr,.paper .ctr{text-align:center}
table.kop{width:100%;border-collapse:collapse;border-bottom:1.25pt solid #000;margin:0 0 12pt}
.paper table.hd td:first-child{padding-left:0}.paper table.hd td:last-child{padding-right:0}
table.kop td{padding:0 0 3pt;vertical-align:middle}
table.kop td.lg{width:62pt;padding:0}
table.kop td.lg img{width:58pt;height:65pt;display:block}
table.kop td.tx{text-align:center;line-height:1.15;font-size:12pt}
table.kop .b{font-weight:bold}table.kop .s{font-size:10pt}
.paper table{border-collapse:collapse}.paper td{vertical-align:top;padding:1pt 4pt}
.ctr{text-align:center}.ttd{width:100%;margin-top:20pt}.ttd td{width:50%;text-align:center}
.paper ol{margin:0 0 8pt;padding-left:20pt}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.paper{box-shadow:none;margin:0;page-break-after:always}}
</style>
</head>
<body>
<header>
  <h1>⚖️ Dokumen Penyumpahan <span>BHP Medan</span></h1>
  <input id="q" placeholder="Cari nama…" style="width:180px">
  <button onclick="newRec()" class="pri">+ Data baru</button>
  <label class="btn pri" style="margin:0">📑 Upload Penetapan<input type="file" accept=".pdf,image/*" hidden onchange="uploadPenetapan(this)"></label>
  <label class="btn" style="margin:0;color:var(--ink)">⬆ Impor CSV<input type="file" accept=".csv" hidden onchange="importCsv(this)"></label>
  <button onclick="exportCsv()">⬇ Ekspor CSV</button>
  <button onclick="openSet()">⚙ Pengaturan</button>
  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="wrap">
  <aside class="card">
    <h3>Daftar Berkas</h3>
    <div class="list" id="list"></div>
  </aside>

  <main class="card" id="main"></main>
</div>
<div id="printArea" hidden></div>
<div class="toast" id="toast"></div>

<dialog id="penDlg" style="border:0;border-radius:16px;padding:0;max-width:760px;width:95%;background:var(--card);color:var(--ink)"><div style="padding:18px" id="penBody"></div></dialog>
<dialog id="setDlg" style="border:0;border-radius:16px;padding:0;max-width:720px;width:95%;background:var(--card);color:var(--ink)">
  <div style="padding:18px" id="setBody"></div>
</dialog>

<script>
/* ---------------- data ---------------- */
const LS='bhpSumpah.v1', LSS='bhpSumpah.set.v1';
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB));localStorage.setItem(LSS,JSON.stringify(SET))}catch(e){}};

const DEF_SET={
  instansi:'KEMENTERIAN HUKUM REPUBLIK INDONESIA',kanwil:'KANTOR WILAYAH SUMATERA UTARA',
  balai:'BALAI HARTA PENINGGALAN MEDAN',alamat:'Jalan Listrik No. 10 Medan',
  telp:'Telepon: (061) 451 7830, Faksimile: (061) 451 4328',
  web:'Laman: www.bhpmedan.kemenkum.go.id, Pos-el: bhp.medan@kemenkum.go.id',
  kepala:'Syafriadi Lubis',wa:'0851-2156-2136',prefix:'W.2.AHU.AHU.1-AH.06.03-',nomorBerikut:3002,
  kanwilTembusan:'Kepala Kantor Wilayah Kementerian Hukum Riau',
  pejabat:[{nama:'',nip:'',jabatan:'Ahli Madya'},{nama:'',nip:'',jabatan:'Ahli Muda'}],
  lafaz:{
    Islam:'WALLAHI (Demi Allah) saya bersumpah, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya.',
    Kristen:'Demi Tuhan saya berjanji, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya. Semoga Tuhan menolong saya.',
    Katholik:'Demi Tuhan saya berjanji, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya. Semoga Tuhan menolong saya.',
    Hindu:'Om Atah Paramawisesa, saya bersumpah, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya.',
    Buddha:'Demi Sang Hyang Adi Buddha, saya bersumpah, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya.',
    Khonghucu:'Kehadirat Tian di tempat yang Maha Tinggi dengan bimbingan Nabi Kongzi, saya bersumpah, bahwa saya akan melakukan dengan sejujur-jujurnya dan dengan tulus ikhlas {JENIS} terhadap {STATUS} saya yang telah diperintahkan dan dipercayakan {PENGADILAN} kepada saya. Wei De Dong Tian.'
  }
};
let SET=Object.assign({},DEF_SET,load(LSS,{}));
let DB=load(LS,[]);
let cur=null, tab='umum';

const blank=()=>({id:Date.now().toString(36),jenis:'Pengampuan',tanggalSurat:today(),
  nomorSurat:'',nomorLurah:'',nomorBA:'',nomorBAHarta:'',
  nama:'',nik:'',jk:'Perempuan',tglLahir:'',agama:'Islam',pekerjaan:'',alamat:'',kelurahan:'',status:'',
  terampu:{nama:'',jk:'Laki-laki',tglLahir:'',kondisi:''},anak:[{nama:'',jk:'Laki-laki',tglLahir:''}],
  pengadilan:'Pengadilan Negeri Pekanbaru',nomorPenetapan:'',tglPenetapan:'',
  tglSumpah:'',waktu:'10:00 - 16:00 WIB',tempat:'',madya:0,muda:1,harta:'',tanah:'',rekening:'',saksi1:'',saksi2:''});

/* ---------------- util tanggal & terbilang ---------------- */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function pd(s){if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function tgl(s){const d=pd(s);return d?`${String(d.getDate()).padStart(2,'0')} ${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'}
function hari(s){const d=pd(s);return d?HARI[d.getDay()]:'…'}
function usia(s,ref){const d=pd(s);if(!d)return'…';const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u+' Tahun'}
function terbilang(n){const s=['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if(n<12)return s[n];if(n<20)return terbilang(n-10)+' Belas';if(n<100)return terbilang(Math.floor(n/10))+' Puluh '+terbilang(n%10);
  if(n<200)return'Seratus '+terbilang(n-100);if(n<1000)return terbilang(Math.floor(n/100))+' Ratus '+terbilang(n%100);
  if(n<2000)return'Seribu '+terbilang(n-1000);return terbilang(Math.floor(n/1000))+' Ribu '+terbilang(n%1000)}
const tb=n=>terbilang(n).replace(/\s+/g,' ').trim();
function tglBA(s){const d=pd(s);return d?`${HARI[d.getDay()]}, tanggal ${tb(d.getDate())} bulan ${BLN[d.getMonth()]} tahun ${tb(d.getFullYear())}`:'…'}
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=v=>v?esc(v):'<span style="background:#fde68a">……</span>';

/* ---------------- turunan ---------------- */
function derive(r){
  const w=r.jenis==='Perwalian', J=w?'Wali':'Pengampu';
  const sapa=r.jk==='Laki-laki'?'Bapak':'Ibu';
  const anak=w?r.anak.filter(a=>a.nama):[];
  const objek=w?anak.map(a=>a.nama).join(', '):r.terampu.nama;
  const statusRel=r.status||(w?'Anak':'Keluarga');
  const kel=r.kelurahan||'';
  let laf=(SET.lafaz[r.agama]||SET.lafaz.Islam).replace('{JENIS}',w?'Perwalian':'Pengampuan')
    .replace('{STATUS}',statusRel+(w?'':'')).replace('{PENGADILAN}',r.pengadilan);
  const pj=SET.pejabat;
  return{w,J,sapa,objek,statusRel,kel,laf,madya:pj[r.madya]||{},muda:pj[r.muda]||{},anak,
    pihak:w?'Anak':'Terampu',jenisTxt:w?'Perwalian':'Pengampuan'};
}

const kop=()=>`<table class="kop"><tr><td class="lg"><img src="${SET.logo||LOGO_DEF}" width="77" height="87" alt="logo"></td><td class="tx">${esc(SET.instansi)}<br>${esc(SET.kanwil)}<br><span class="b">${esc(SET.balai)}</span><br><span class="s">${esc(SET.alamat)}<br>${esc(SET.telp)}<br>${esc(SET.web)}</span></td></tr></table>`;
function head(no,hal,r){return `<table class="hd" style="width:100%;margin-bottom:12pt"><tr><td style="width:70pt">Nomor</td><td>:</td><td>${V(no)}</td><td style="text-align:right">${tgl(r.tanggalSurat)}</td></tr>
<tr><td>Sifat</td><td>:</td><td>Segera</td><td></td></tr><tr><td>Lampiran</td><td>:</td><td>-</td><td></td></tr>
<tr><td>Hal</td><td>:</td><td colspan=2>${hal}</td></tr></table>`}
const jadwal=(r,note)=>`<table style="margin:0 0 10pt 20pt"><tr><td style="width:90pt">Hari/Tanggal</td><td>:</td><td>${hari(r.tglSumpah)} / ${tgl(r.tglSumpah)}</td></tr>
<tr><td>Pukul</td><td>:</td><td>${V(r.waktu)} (${note} <b>${esc(SET.wa)}</b>)</td></tr><tr><td>Tempat</td><td>:</td><td>${esc(r.tempat||'Kediaman '+(r.nama||''))}</td></tr></table>`;
const ttdKepala=()=>`<div style="margin:20pt 0 0 55%">Kepala,<br><br><br><br><b>${esc(SET.kepala)}</b></div>`;
const tembusan=r=>`<p class="ni" style="margin-top:18pt">Tembusan:</p><ol><li>Direktur Jenderal Administrasi Hukum Umum Kementerian Hukum RI;</li><li>Direktur Perdata Direktorat Jenderal Administrasi Hukum Umum;</li><li>${esc(SET.kanwilTembusan)};</li><li>Lurah ${V(r.kelurahan)}</li></ol>`;
const penetapan=r=>`Menindaklanjuti Penetapan ${esc(r.pengadilan)} Nomor: ${V(r.nomorPenetapan)} tertanggal ${tgl(r.tglPenetapan)} yang telah memperoleh kekuatan hukum tetap`;
const pasal=d=>d.w?'Pasal 366':'Pasal 449';

const DOCS={
  surat:{nama:r=>`Surat ke ${derive(r).J}`,fn:r=>{const d=derive(r);return kop()+head(r.nomorSurat,`Pengambilan Sumpah ${d.J} dan Inventarisasi Harta`,r)+
    `<p class="ni">Yth. <b>${d.sapa} ${V(r.nama)}</b><br>di</p><p class="ni" style="margin-left:18pt;max-width:230pt">${V(r.alamat)}</p><br>
<p>${penetapan(r)}, ${d.sapa} telah ditunjuk secara resmi sebagai ${d.J} atas <b>${V(d.objek)}</b> (selanjutnya disebut sebagai "${d.pihak}").</p>
<p>Berkaitan dengan penetapan tersebut, Balai Harta Peninggalan Medan sangat menghargai serta mendukung penuh kesediaan ${d.sapa} dalam menjalankan tugas sebagai ${d.J}. Berdasarkan amanat ${pasal(d)} Kitab Undang-Undang Hukum Perdata (KUHPerdata), BHP bertugas mendampingi dan memberikan konsultasi hukum kepada ${d.sapa} guna memastikan bahwa pengelolaan aset dan perlindungan hak ${d.pihak} berjalan dengan baik serta melindungi ${d.sapa} dari kemungkinan prasangka negatif dari pihak lain.</p>
<p>Selanjutnya, sesuai dengan perintah peraturan perundang-undangan yang tertuang dalam Pasal 362 KUHPerdata, setiap ${d.J.toLowerCase()} diwajibkan untuk diangkat sumpah sebelum mulai menjalankan tugas. Penyumpahan ini sangat penting dan menjadi syarat sah agar ${d.sapa} dapat bertindak secara hukum mewakili ${d.pihak} untuk berbagai keperluan administratif.</p>
<p>Dalam rangka mewujudkan pelayanan publik, Tim Balai Harta Peninggalan Medan akan melakukan kunjungan untuk menyelenggarakan kegiatan Pengangkatan Sumpah tersebut di kediaman ${d.sapa} pada:</p>`+

    `<p>Guna kelengkapan administrasi Berita Acara Penyumpahan dan pencatatan administrasi sesuai prosedur hukum, kami memohon kesediaan ${d.sapa} untuk mempersiapkan dokumen pendukung pada saat kegiatan, yang meliputi:</p>

function F(path,lbl,type='text',opt){const v=get(path);

  if(type==='area')return`<div class="full"><label>${lbl}</label><textarea oninput="setv('${path}',this.value)">${esc(v)}</textarea></div>`;
  return`<div><label>${lbl}</label><input type="${type}" value="${esc(v)}" oninput="setv('${path}',this.value)"></div>`}
function get(p){return p.split('.').reduce((o,k)=>o?.[k],cur)??''}
function setv(p,v){const ks=p.split('.');let o=cur;ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=v;
  if(p==='alamat'&&!cur._kelManual){const m=v.match(/Kelurahan[^,]*,\s*Kecamatan[^,]*(,[^,]*){0,2}/i);if(m){cur.kelurahan=m[0];const i=document.querySelector('[data-kel]');if(i)i.value=cur.kelurahan}}

function preview(k){$('#prev').innerHTML=`<div class="paper">${DOCS[k].fn(cur)}</div>`}

function pr(keys){const a=$('#printArea');a.innerHTML=html(keys);a.hidden=false;window.print();a.hidden=true}
function dl(keys){const css=document.querySelector('style').textContent.match(/\.paper\{[^]*?\.ttd td\{[^}]*\}/)[0];
  const src=SET.logo||LOGO_DEF, mime=src.slice(5,src.indexOf(';')), b64=src.split(',')[1];

  const n=(keys.length>1?'Dokumen Lengkap':DOCS[keys[0]].nama(cur))+` - ${cur.nama||'tanpa nama'}.doc`;

/* ---------------- CSV (kompatibel kolom spreadsheet AutoCrat) ---------------- */
function parseCsv(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function toISO(s){if(!s)return'';const m=s.match(/(\d{1,2})\s+(\w+)\s+(\d{4})/);if(!m)return'';const b=BLN.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
  return b<0?'':`${m[3]}-${String(b+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`}
function importCsv(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{const rows=parseCsv(t);const H=rows.shift().map(h=>h.trim());let n=0;
  rows.forEach(v=>{const g=k=>{const i=H.indexOf(k);return i<0?'':(v[i]||'').trim()};const w=H.includes('Nama_Wali');
    const nama=g(w?'Nama_Wali':'Nama_Pengampu');if(!nama)return;const r=blank();
    Object.assign(r,{jenis:w?'Perwalian':'Pengampuan',nama,nik:g(w?'NIK_Wali':'NIK_Pengampu'),jk:/laki/i.test(g(w?'Jenis_Kelamin_Wali':'Jenis_Kelamin_Pengampu'))?'Laki-laki':'Perempuan',
      tglLahir:toISO(g(w?'Tanggal_Lahir_Wali':'Tanggal_Lahir_Pengampu')),agama:g(w?'Agama_Wali':'Agama_Pengampu')||'Islam',pekerjaan:g(w?'Pekerjaan_Wali':'Pekerjaan_Pengampu'),
      alamat:g(w?'Alamat_Wali':'Alamat_Pengampu'),kelurahan:g('Kel_Kec_Kota'),status:g(w?'Status_Dengan_Wali':'Status_Dengan_Pengampu'),
      nomorSurat:g(w?'Nomor_Surat_Wali':'Nomor_Surat_Pengampu'),nomorLurah:g('Nomor_Surat_Lurah'),tanggalSurat:toISO(g('Tanggal_Surat'))||today(),
      nomorPenetapan:g('Nomor_Penetapan'),tglPenetapan:toISO(g('Tanggal_Penetapan')),tglSumpah:toISO(g('Hari_Tanggal_Sumpah')),waktu:g('Waktu_Sumpah')||r.waktu,tempat:g('Tempat_Sumpah'),
      pengadilan:g('Lokasi_Pengadilan')||r.pengadilan,tanah:g('Daftar_Tanah'),rekening:g('Daftar_Rekening'),
      nomorBA:g(w?'Nomor_BA_Sumpah_Wali':'Nomor_BA_Sumpah_Pengampu'),nomorBAHarta:g(w?'Nomor_BA_Harta_Wali':'Nomor_BA_Harta_Pengampu')});
    if(w){r.anak=[{nama:g('Nama_Anak')||g('Nama_Anak_1'),jk:/perem/i.test(g('Jenis_Kelamin_Anak'))?'Perempuan':'Laki-laki',tglLahir:toISO(g('Tanggal_Lahir_Anak'))}]}
    else r.terampu={nama:g('Nama_Terampu'),jk:/perem/i.test(g('Jenis_Kelamin_Terampu'))?'Perempuan':'Laki-laki',tglLahir:toISO(g('Tanggal_Lahir_Terampu')),kondisi:g('Kondisi_Medis_Terampu')};
    r.id=Date.now().toString(36)+n;DB.push(r);n++});save();renderList();toast(n+' berkas diimpor');inp.value=''})}
function exportCsv(){const H=['Jenis','Nama','NIK','Jenis_Kelamin','Tanggal_Lahir','Agama','Pekerjaan','Alamat','Kel_Kec_Kota','Status','Objek','Nomor_Penetapan','Tanggal_Penetapan','Tanggal_Sumpah','Nomor_Surat','Nomor_Surat_Lurah','Nomor_BA'];

/* ---------------- baca PDF penetapan ---------------- */
const loadJs=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('Gagal memuat '+src));document.head.appendChild(e)});
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
let penFill=false;
function uploadPenetapan(inp,fill){penFill=!!fill;const f=inp.files[0];inp.value='';if(f)handlePenetapan(f)}
function busy(t){$('#penBody').innerHTML=`<div style="text-align:center;padding:30px"><div style="font-size:32px">⏳</div><b id="penStat">${t}</b><p class="hint">Dokumen diproses di browser Anda.</p></div>`;if(!$('#penDlg').open)$('#penDlg').showModal()}
const stat=t=>{const e=$('#penStat');if(e)e.textContent=t};
async function handlePenetapan(file){
  if(!file)return;busy('Membaca '+file.name+'…');
  try{
    let data;
    if(SET.geminiKey){stat('Menganalisis dengan AI Gemini…');try{data=await geminiExtract(file)}catch(e){console.warn(e);toast('AI gagal, pakai pembaca biasa')}}
    if(!data){const text=await fileText(file);if(text.replace(/\s/g,'').length<80)throw new Error('Teks tidak terbaca dari file.');data=parsePenetapan(text);data._text=text}
    reviewPenetapan(data,file.name);
  }catch(e){$('#penBody').innerHTML=`<h3>Gagal membaca penetapan</h3><p>${esc(e.message)}</p><p class="hint">Coba file PDF asli (bukan foto miring/buram), atau isi Gemini API key di Pengaturan.</p><p style="text-align:right"><button onclick="penDlg.close()">Tutup</button></p>`}
}
async function fileText(file){
  if(file.type.startsWith('image/'))return ocr([file]);
  await loadJs(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS.replace('pdf.min.js','pdf.worker.min.js');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
  for(let i=1;i<=pdf.numPages;i++){stat(`Membaca halaman ${i}/${pdf.numPages}…`);const c=await(await pdf.getPage(i)).getTextContent();
    let y=null;c.items.forEach(it=>{const ny=it.transform[5];out+=(y!==null&&Math.abs(ny-y)>3?'\n':' ')+it.str;y=ny});out+='\n'}
  if(out.replace(/\s/g,'').length>200)return out;
  const imgs=[];for(let i=1;i<=Math.min(pdf.numPages,12);i++){stat(`Menyiapkan OCR halaman ${i}…`);const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;imgs.push(cv)}
  return ocr(imgs)}
async function ocr(imgs){await loadJs(TESS);const w=await Tesseract.createWorker('ind');let t='';
  for(let i=0;i<imgs.length;i++){stat(`OCR (scan) halaman ${i+1}/${imgs.length}… agak lama`);t+=(await w.recognize(imgs[i])).data.text+'\n'}await w.terminate();return t}

/* heuristik teks penetapan PN (format direktori putusan MA) */
function parsePenetapan(raw){
  let t=raw.replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\b((?:[A-Z] ){3,}[A-Z])\b/g,m=>m.replace(/ /g,''));
  let flat=t.replace(/\s*\n\s*/g,' ')
    .replace(/Mahkamah Agu[^\n]*?epublik Indonesia/g,' ').replace(/Disclaimer Kepaniteraan.*?Halaman \d+/g,' ')
    .replace(/Direktori Putusan Mahkamah Agung Republik Indonesia putusan\.mahkamahagung\.go\.id/g,' ')
    .replace(/Hal(?:aman)?\.?\s*\d+\s*dari\s*\d+\s*Halaman[^;]*?PN\s*\w+/gi,' ')
    .replace(/\b(\d{1,2})\s*[–—\-\/.]\s*(\d{1,2})\s*[–—\-\/.]\s*(\d{4})\b/g,(m,d,b,y)=>+b>=1&&+b<=12?`${d.padStart(2,'0')} ${BLN[b-1]} ${y}`:m)
    .replace(/\s+/g,' ');
  const R={};const m1=(re,s=flat)=>{const m=s.match(re);return m?m[1].trim():''};
  const NM="([A-Z][A-Z.' ]{2,}?)";
  const cleanName=n=>(n||'').replace(/^(Sdr\.?|Sdri\.?|Tn\.?|Ny\.?|Nn\.?)\s*/i,'').replace(/[;:,.\s-]+$/,'').trim();
  const D='(\\d{1,2}\\s+(?:'+BLN.join('|')+')\\s+\\d{4})';
  R.nomorPenetapan=m1(/Nomor\s*:?\s*(\d+\s*\/\s*Pdt\.?\s*P\s*\/\s*\d{4}\s*\/\s*P[NA]\s*[A-Za-z.]+)/i).replace(/\s*\/\s*/g,'/').replace(/Pdt\.?\s*P/i,'Pdt.P');
  R.pengadilan=m1(/(Pengadilan (?:Negeri|Agama) [A-Z][a-zA-Z]+(?: [A-Z][a-zA-Z]+)?)/).replace(/\s+(Yang|Kelas|Tersebut|Telah|Nomor)$/,'');
  const ai=flat.search(/MENETAPKAN|MENGADILI/);const amar=ai>=0?flat.slice(ai):flat;
  R.jenis=/pengampu/i.test(amar)||(!/\bwali\b/i.test(amar)&&/pengampu/i.test(flat))?'Pengampuan':'Perwalian';
  const tp=[...flat.matchAll(new RegExp('(?:ditetapkan|diucapkan|dijatuhkan)[^.]{0,120}?tanggal\\s+'+D,'gi'))];
  R.tglPenetapan=toISO(tp.length?tp[0][1]:'');
  // pemohon
  const st=flat.search(/(?:permohonan\s+)?dari\s*:|diajukan oleh\s*:?|Pemohon\s*:/i);
  let blk=st>=0?flat.slice(st,st+1500):'';const ct=blk.search(/sebagai\s*-*\s*Pemohon|selanjutnya disebut|Pengadilan (?:Negeri|Agama) tersebut/i);if(ct>0)blk=blk.slice(0,ct);
  blk=blk.replace(/^(?:permohonan\s+)?(?:dari|diajukan oleh|Pemohon)\s*:?\s*/i,'');
  const LB='(?:Nama|NIK|Tempat|Tgl|Tanggal Lahir|Umur|Jenis Kelamin|Agama|Pekerjaan|Alamat|Bertempat tinggal|Kewarganegaraan|Warga Negara|Pendidikan|Status)';
  const L=lab=>m1(new RegExp('\\b'+lab+'\\s*:?\\s*(.+?)(?=[,;]\\s*'+LB+'\\b|;|$)','i'),blk);
  R.nama=cleanName(L('Nama')||m1(/^([^,;]+)/,blk));
  R.nik=m1(/NIK\s*:?\s*(\d{16})/,blk);
  const tl=blk.match(new RegExp('[Ll]ahir[^0-9]{0,60}?'+D));R.tglLahir=tl?toISO(tl[1]):'';
  R.jk=/perempuan|wanita/i.test(blk)?'Perempuan':/laki/i.test(blk)?'Laki-laki':'';
  const ag=(L('Agama')||'').toLowerCase();
  R.agama=!ag?'':/protestan|kristen/.test(ag)?'Kristen':/katol|kathol/.test(ag)?'Katholik':/bud/.test(ag)?'Buddha':/hindu/.test(ag)?'Hindu':/kong|konghu/.test(ag)?'Khonghucu':'Islam';
  R.pekerjaan=L('Pekerjaan');
  R.alamat=(L('(?:Alamat|Bertempat tinggal di|Bertempat tinggal|Tempat tinggal)')).replace(/^di\s+/i,'').replace(/\s*-\s*(?=[A-Z])/g,', ');
  const k=R.alamat.match(/Kel(?:urahan|\s*\/\s*Desa|\.)?\.?\s*([^,]+?),\s*Kec(?:amatan|\.)?\.?\s*([^,]+?)(?:,\s*([^,;]+?))?(?:,\s*([^,;]+))?$/i);
  R.kelurahan=k?[`Kelurahan ${k[1].replace(/^\.\s*/,'')}`,`Kecamatan ${k[2]}`,k[3],k[4]].filter(Boolean).join(', '):'';
  const rel=m1(/\b(ibu kandung|ayah kandung|bapak kandung|saudara kandung|anak kandung|kakak kandung|adik kandung|suami|isteri|istri|paman|bibi|kakek|nenek|keponakan|cucu)(?=nya|\b)/i);
  R.status=rel?rel.replace(/\b\w/g,c=>c.toUpperCase()):'';
  const after=(n,src)=>{const i=src.indexOf(n);return i<0?'':src.slice(i,i+300)};
  if(R.jenis==='Pengampuan'){
    const endN="(?=\\s*[,;(]|\\s+(?:bin|binti|[Ll]ahir|Tempat|[Uu]mur|NIK|[Yy]ang|karena|dikarenakan)\\b)";
    let n=m1(new RegExp('[Pp]engampu[^A-Z]{0,80}?(?:bernama|terhadap|atas|dari|bagi)\\s*:?\\s*-?\\s*'+NM+endN),amar)
       ||m1(new RegExp('(?:di ?bawah pengampuan)[^A-Z]{0,40}?'+NM+endN),amar)
       ||m1(new RegExp('[Pp]engampu[^A-Z]{0,80}?(?:bernama|terhadap|atas|dari|bagi)\\s*:?\\s*-?\\s*'+NM+endN));
    n=cleanName(n);const ctx=after(n,amar)||after(n,flat);
    const tt=ctx.match(new RegExp('[Ll]ahir[^0-9]{0,60}?'+D));
    let kond=m1(/(?:mengalami|menderita|mengidap)\s+(?:penyakit\s+)?(.{5,160}?)(?=\s+Untuk\b|\s+sesuai\b|\s+sehingga\b|;|\.\s|$)/i,amar)||m1(/(?:mengalami|menderita|mengidap)\s+(?:penyakit\s+)?(.{5,160}?)(?=\s+Untuk\b|\s+sesuai\b|\s+sehingga\b|;|\.\s|$)/i);
    const sk=m1(/(Surat Keterangan Dokter.{0,120}?)(?=;|\s+diberi\b)/i);if(kond&&sk)kond+=' sesuai dengan '+sk;
    R.terampu={nama:n,jk:/perempuan|wanita|\bibu\b|nenek|isteri|istri/i.test(R.status+' '+ctx)?'Perempuan':'Laki-laki',tglLahir:tt?toISO(tt[1]):'',kondisi:kond};
  }else{
    const seen=new Set();R.anak=[];
    const scan=src=>{for(const m of src.matchAll(new RegExp(NM+"\\s*,?\\s*(?:\\(?(laki-laki|perempuan|Laki-laki|Perempuan)\\)?\\s*,?\\s*)?[^A-Z0-9]{0,40}?[Ll]ahir[^0-9]{0,60}?"+D,'g'))){
      const nm=cleanName(m[1]).replace(/^(?:[a-z]\.|\d+\.)\s*/,'');if(nm.length<3||seen.has(nm)||nm===R.nama||/^(Tempat|Tanggal|Kartu|Akta)/.test(nm))continue;seen.add(nm);
      R.anak.push({nama:nm,jk:/perempuan/i.test(m[2]||after(nm,src).slice(0,120))?'Perempuan':'Laki-laki',tglLahir:toISO(m[3])})}};
    scan(amar);if(!R.anak.length)scan(flat);
  }
  return R}

async function geminiExtract(file){
  const b64=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(file)});
  const prompt=`Ekstrak data dari Penetapan Pengadilan (perwalian/pengampuan) ini. Balas JSON saja dengan kunci:
{"jenis":"Pengampuan|Perwalian","pengadilan":"","nomorPenetapan":"","tglPenetapan":"YYYY-MM-DD","nama":"nama pemohon yg diangkat wali/pengampu","nik":"","jk":"Laki-laki|Perempuan","tglLahir":"YYYY-MM-DD","agama":"Islam|Kristen|Katholik|Hindu|Buddha|Khonghucu","pekerjaan":"","alamat":"alamat lengkap","kelurahan":"Kelurahan X, Kecamatan Y, Kota Z, Provinsi","status":"hubungan pemohon dgn terampu/anak mis. Ibu Kandung","terampu":{"nama":"","jk":"","tglLahir":"YYYY-MM-DD","kondisi":"kondisi medis + dasar surat dokter"},"anak":[{"nama":"","jk":"","tglLahir":"YYYY-MM-DD"}]}
Kosongkan yang tidak ada. Nama dalam HURUF KAPITAL.`;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${SET.geminiModel||'gemini-2.5-flash'}:generateContent?key=${encodeURIComponent(SET.geminiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:file.type||'application/pdf',data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
  if(!res.ok)throw new Error('Gemini '+res.status);const j=await res.json();
  const d=JSON.parse(j.candidates[0].content.parts[0].text);d._ai=true;return d}

const PEN_LBL={jenis:'Jenis',pengadilan:'Pengadilan',nomorPenetapan:'Nomor Penetapan',tglPenetapan:'Tanggal Penetapan',nama:'Nama Pemohon (Wali/Pengampu)',nik:'NIK',jk:'Jenis Kelamin',tglLahir:'Tanggal Lahir',agama:'Agama',pekerjaan:'Pekerjaan',alamat:'Alamat',kelurahan:'Kelurahan/Kec/Kota',status:'Hubungan'};
let PEN=null;
function reviewPenetapan(d,fname){PEN=d;const w=d.jenis==='Perwalian';
  const row=(k,lbl,v,type='text')=>`<div><label>${lbl}</label><input type="${type}" value="${esc(v||'')}" data-pk="${k}" style="${v?'':'background:#fde68a33;border-color:#f59e0b'}"></div>`;
  let h=`<h3>📑 Hasil baca: ${esc(fname)} ${d._ai?'<span class="tag">AI</span>':''}</h3><p class="hint">Periksa & koreksi dulu. Kolom oranye = tidak ditemukan di dokumen.</p><div class="grid">`;
  h+=`<div><label>Jenis</label><select data-pk="jenis">${['Pengampuan','Perwalian'].map(j=>`<option ${j===d.jenis?'selected':''}>${j}</option>`).join('')}</select></div>`;
  ['pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','status'].forEach(k=>h+=row(k,PEN_LBL[k],d[k],/^tgl/.test(k)?'date':'text'));
  h+=`<div class="full">${row('alamat','Alamat',d.alamat)}</div><div class="full">${row('kelurahan','Kelurahan, Kecamatan, Kota',d.kelurahan)}</div>`;
  if(w)(d.anak||[]).forEach((a,i)=>h+=row(`anak.${i}.nama`,`Anak ${i+1}`,a.nama)+row(`anak.${i}.tglLahir`,'Tgl lahir',a.tglLahir,'date')+row(`anak.${i}.jk`,'JK',a.jk));
  else{const t=d.terampu||{};h+=row('terampu.nama','Nama Terampu',t.nama)+row('terampu.tglLahir','Tgl Lahir Terampu',t.tglLahir,'date')+row('terampu.jk','JK Terampu',t.jk)+`<div class="full">${row('terampu.kondisi','Kondisi medis',t.kondisi)}</div>`}
  h+=`</div>${d._text?`<details style="margin-top:10px"><summary class="hint">Lihat teks hasil baca</summary><pre style="white-space:pre-wrap;max-height:200px;overflow:auto;font-size:11px">${esc(d._text)}</pre></details>`:''}
  <p style="text-align:right;display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button onclick="penDlg.close()">Batal</button><button class="pri" onclick="applyPenetapan()">✔ Terapkan ke berkas</button></p>`;
  $('#penBody').innerHTML=h;if(!$('#penDlg').open)$('#penDlg').showModal()}
function applyPenetapan(){
  $('#penBody').querySelectorAll('[data-pk]').forEach(e=>{const ks=e.dataset.pk.split('.');let o=PEN;ks.slice(0,-1).forEach((k,i)=>{o[k]=o[k]??(/^\d+$/.test(ks[i+1])?[]:{});o=o[k]});o[ks.at(-1)]=e.value.trim()});
  let r=(penFill&&cur)?cur:null;if(!r){r=blank();r.nomorSurat=nextNo();r.nomorLurah=nextNo();DB.unshift(r)}
  ['jenis','pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','alamat','kelurahan','status'].forEach(k=>{if(PEN[k])r[k]=PEN[k]});
  if(PEN.kelurahan)r._kelManual=true;
  if(PEN.jenis==='Perwalian'){const a=(PEN.anak||[]).filter(x=>x&&x.nama).map(x=>({nama:x.nama,jk:/perem/i.test(x.jk)?'Perempuan':'Laki-laki',tglLahir:x.tglLahir||''}));if(a.length)r.anak=a}
  else if(PEN.terampu){const t=PEN.terampu;r.terampu={nama:t.nama||'',jk:/perem/i.test(t.jk)?'Perempuan':'Laki-laki',tglLahir:t.tglLahir||'',kondisi:t.kondisi||''}}
  cur=r;tab='jadwal';save();penDlg.close();renderList();renderMain();toast('Data penetapan diterapkan — lanjut isi jadwal sumpah')}
